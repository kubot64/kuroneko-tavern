<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒場・黒猫亭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
/* 本文の字体では半角の「+」が全角ほどの幅に見えるので、「+」の一字だけ欧文の字体で出す。空白を含まないので、行の高さは本文の字体のまま */
@font-face{font-family:"KN Plus";src:local("Helvetica Neue"),local("HelveticaNeue"),local("Arial"),local("ArialMT"),local("Roboto"),local("Roboto-Regular"),local("Segoe UI"),local("Liberation Sans"),local("DejaVu Sans");unicode-range:U+002B;font-weight:100 900}
/* Layout: tavern counter (top bar) / crystals + parties on the left, ledger tabs on the right. One deliberate night-time look. */
:root{
  --bg:#17120e; --panel:#211a14; --panel2:#2a2119; --line:#3d3025;
  --fg:#ecdfc7; --muted:#a8957a; --amber:#e3a649; --amber-dim:#8a6430;
  --crystal:#0a0e1d; --crystal-fg:#d7e2ff; --crystal-dim:#7d8bb5; --glow:#5d7dff;
  --blood:#e2604f; --heal:#72cf8f; --ash:#8f8a84; --rival:#9fb4d8;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"KN Plus","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-log:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  --paybar-h:0px;
  --toast-h:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:10px;border-bottom:1px solid var(--line)}
.sign{display:flex;align-items:center;gap:10px}
.sign svg{width:34px;height:34px;flex:none}
.sign h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.08em;line-height:1}
.sign small{display:block;color:var(--muted);font-size:11px;letter-spacing:.2em}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stats b{color:var(--fg);font-size:16px;margin-inline:2px}
.stats .gold b{color:var(--amber)}
.ctrl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px}
.btn:hover{border-color:var(--amber-dim)}
.btn.on{background:var(--amber);color:#1b1309;border-color:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.pol{min-width:8em;text-align:center}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.h2{font-family:var(--f-display);font-size:15px;letter-spacing:.12em;margin:0 0 8px;color:var(--amber);display:flex;align-items:baseline;gap:10px}
.h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0}

/* crystals */
.crystals{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.crystal{background:radial-gradient(120% 90% at 50% 0%,#141c3a 0%,var(--crystal) 60%);border:1px solid #26305a;border-radius:14px;box-shadow:0 0 0 1px #0004 inset,0 0 24px -8px var(--glow);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.crystal.sel{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow) inset,0 0 30px -6px var(--glow)}
.c-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;padding:9px 12px;border-bottom:1px solid #1d2546;cursor:pointer}
.c-head .orb{width:10px;height:10px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);flex:none;align-self:center}
.c-head .nm{font-family:var(--f-display);color:var(--crystal-fg);font-size:15px;min-width:0;line-height:1.35}
.c-head .nm .ja{font-family:var(--f-body);font-size:13px;color:var(--crystal-dim)}
.c-head .fl{margin-left:auto;font-family:var(--f-log);color:var(--crystal-dim);font-size:13px;white-space:nowrap}
.c-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px;padding:8px 12px;font-family:var(--f-log);font-size:12px;color:var(--crystal-fg);border-bottom:1px solid #1d2546;font-variant-numeric:tabular-nums}
.c-members .m{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.c-members .m.low{color:var(--amber)}
.c-members .m.crit,.c-members .m.dead{color:var(--blood)}
.c-members .wound{margin-left:.35em}
.c-log{font-family:var(--f-log);font-size:13px;line-height:1.55;color:var(--crystal-fg);padding:10px 12px;height:380px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.c-log .sys{color:#fff;text-align:center}
.c-log .say{color:#ffe2a8}
.c-log .death{color:var(--blood)}
.c-log .loot{color:#9fe0b2}
.c-log .move{color:var(--crystal-dim)}
.c-log .lvl{color:#c8b6ff}
.c-log .nw{animation:lineIn .18s ease-out both}
@keyframes lineIn{from{opacity:0;transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.c-log .nw{animation:none}}
.c-empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--crystal-dim);font-family:var(--f-log);height:100%;min-height:200px;padding:20px}
.c-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #1d2546;font-size:12px;color:var(--crystal-dim)}
.c-foot .btn{background:#151c36;border-color:#2a3666;color:var(--crystal-fg)}
.c-foot .btn:hover{border-color:var(--glow)}
.c-warn{flex:1 1 12em;min-width:min(100%,12em);font-family:var(--f-log);font-size:12px;line-height:1.45;color:var(--blood);word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.c-warn .thought,.c-warn .fight{display:block}
.c-warn .thought{color:#ffe2a8}
.c-warn .fight{color:var(--crystal-dim);font-size:11px}
.c-loot{margin-left:auto}

/* party strip. Facts stay in the same order on every card so parties can be compared by eye. */
.parties{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard:hover{border-color:var(--amber-dim)}
.pcard.watching{border-color:var(--glow)}
.pcard.rival{background:#1b1a1c}
.pcard .top{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:nowrap}
.pcard .pn{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.pn .ja,.nm .ja{font-weight:400}
.pcard .pn .ja{color:var(--muted)}
.tag{font-size:10px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.tag.ours{color:var(--amber);border-color:var(--amber-dim)}
.tag.rival{color:var(--rival);border-color:#3c4a66}
.pcard .facts{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard .facts b{color:var(--fg);font-weight:700;margin-inline-start:3px}
.pcard .st{font-size:12px;color:var(--muted);word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.pcard .st.bad{color:var(--blood)}
.pcard .st.ret{color:var(--amber)}
.pcard .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:1px 10px;font-size:12px;line-height:1.45}
.pcard .who{display:flex;align-items:baseline;gap:4px;min-width:0}
.pcard .who .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .who .cls{flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.pcard .who.lead .nm{color:var(--amber)}
.pcard .who.down .nm,.pcard .who.down .cls{color:var(--blood)}
/* 行方の知れない者は、倒れた者の赤ではなく、灰色で出す */
.pcard .who.gone .nm,.pcard .who.gone .cls{color:var(--ash)}
.hpstrip{display:flex;gap:3px}
.hpstrip i{flex:1;height:5px;border-radius:2px;background:#0003;position:relative;overflow:hidden}
.hpstrip i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c)}

/* side ledger */
.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;position:sticky;top:8px;max-height:calc(100vh - 24px)}
.payline{flex:none;margin:0;padding:6px 12px;text-align:center;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;background:var(--panel)}
.payline b{color:var(--amber);font-size:15px;margin-inline:2px}
.memo{font-family:var(--f-display);border:1px dashed var(--line);border-radius:6px;padding:8px 12px 4px;margin:0 0 14px;background:var(--panel2)}
.memo h3{font-family:var(--f-display);color:var(--amber);letter-spacing:.12em;font-size:14px;font-weight:700;margin:0 0 4px}
.memo ul{margin:0;padding:0 0 4px 1.2em}
.memo li{margin:3px 0;line-height:1.55;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.memo li.done{color:var(--muted)}
.memo .when{font-family:var(--f-body);font-size:12px;margin-left:.6em;color:var(--muted);white-space:nowrap;overflow-wrap:normal}
.memoline{display:block;width:100%;margin:0;text-align:left;font-family:var(--f-display);font-size:14px;line-height:1.55;color:var(--amber);background:var(--panel2);border:1px dashed var(--amber-dim);border-radius:6px;padding:8px 12px;cursor:pointer;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.memoline:hover{border-color:var(--amber)}
.tabs{display:flex;flex-direction:column;flex:none;border-bottom:1px solid var(--line)}
.tabrow{display:flex;align-items:center;flex-wrap:wrap;min-width:0}
.tabrow+.tabrow{border-top:1px dashed var(--line)}
.tabs .tg{font-size:10px;color:var(--muted);padding:0 4px 0 10px;letter-spacing:.1em;flex:none;opacity:.8}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--amber)}
.tabs .cnt{font-size:10px;color:var(--amber);margin-left:3px}
.tbody{padding:12px 14px;overflow-y:auto;flex:1;min-height:300px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.news li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.5}
.news .d{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap;overflow-wrap:normal}
.news .death{color:var(--blood)}
.news .lost{color:var(--ash)}
.news .record{color:var(--amber)}
.news .loot{color:var(--heal)}
.news .rumor{color:var(--rival)}
.news .lore{color:#c8b6ff}
.news .edict{color:var(--fg);font-weight:700}
.news .errand{color:#e6c590}
.news .letter{color:#8fb4c9}
.markmark{color:var(--amber);font-size:11px;margin-left:4px}
.quote.board{border-left:3px solid var(--amber-dim)}
.quote.board .pick{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px}
.quote.edict{border-left:3px solid var(--amber)}
.note{color:var(--muted);font-size:12px;margin:0 0 10px}
.boardhelp{margin:0 0 10px}
.markline{color:var(--fg);font-size:13px;line-height:1.55;margin:0 0 10px;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.sect{margin-bottom:16px}
.sect h3{font-size:12px;color:var(--muted);letter-spacing:.15em;margin:0 0 6px;font-weight:400}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.row .who{min-width:0;flex:1}
.row .who b{font-weight:700}
.row .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.flow{display:grid;grid-template-columns:max-content minmax(0,1fr) minmax(0,1fr);column-gap:8px;row-gap:1px;align-items:baseline;font-size:13px;font-variant-numeric:tabular-nums;margin:0}
.flow>:nth-child(-n+3){color:var(--muted);font-size:11px}
.flow>:nth-child(3n+1){white-space:nowrap;overflow-wrap:normal}
.flow>:nth-child(3n+2),.flow>:nth-child(3n+3){text-align:right}
.flow .num{white-space:nowrap;overflow-wrap:normal}
/* 設備と席の段は、どの幅でも名前の次の行。左端は名前と揃う */
.row .meta.lv{display:block;white-space:nowrap}
.ttl{color:var(--amber);font-size:12px}
.chip{font-size:11px;padding:0 6px;border-radius:3px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.dead,.chip.down{color:var(--blood)} .chip.ash{color:var(--ash)} .chip.party{color:var(--glow)} .chip.missing{color:var(--blood)}
.quote{font-size:13px;padding:8px 10px;background:var(--panel2);border-radius:4px;margin-bottom:8px}
.quote.chat div{line-height:1.7}
.quote.chat .nm-link{font-weight:700}
.quote .by{color:var(--muted);font-size:11px;display:block}
.stone{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:linear-gradient(#26201a,#1c1712)}
.stone b{font-family:var(--f-display)}
.stone .ep{color:var(--muted);font-size:12px}
.ledger{color:var(--muted);font-size:12px;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}

/* modal */
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--panel);border:1px solid var(--amber-dim);border-radius:8px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
.mbox h2{font-family:var(--f-display);margin:0 0 4px;font-size:22px;letter-spacing:.1em}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sum div{background:var(--panel2);border-radius:4px;padding:8px;text-align:center}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:11px;color:var(--muted)}
@media (max-width:420px){.sum{grid-template-columns:repeat(2,1fr)}}
.mbox.wide{max-width:640px}
.ending p{margin:10px 0;line-height:1.8}
.ending .said{padding-left:1em;border-left:2px solid var(--amber-dim)}
.nm-link{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--amber-dim);text-underline-offset:3px;cursor:pointer}
.nm-link:hover{color:var(--amber)}
.c-members .nm-link{font-weight:400;text-decoration-color:#3a4677}
.c-members .nm-link:hover{color:#fff}
.adv-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.adv-h h2{margin:0}
.adv-h .markbtn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:44px;min-height:44px}
.markwhy{color:var(--fg);font-size:13px;line-height:1.55;margin:4px 0 10px;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.adv-sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.dream{border-left:3px solid var(--amber);padding:6px 10px;background:var(--panel2);margin:10px 0;font-size:13px}
.dream.done{border-left-color:var(--heal)}
.dream.odd{border-left-color:var(--rival)}
.dream.cls{border-left-color:var(--glow)}
.clsmark{color:var(--glow);font-size:11px;margin-left:4px}
.cl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 8px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cl b{font-size:13px}
.cl span{color:var(--muted)}
.eqtab{display:flex;flex-direction:column;margin:10px 0;border-top:1px solid var(--line)}
.eqtab>div{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.eqtab .sl{color:var(--muted);font-size:12px}
.eqtab .st{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}
.eqtab .rare{color:var(--amber)}
.eqtab .none{color:var(--muted)}
.mat{display:grid;grid-template-columns:76px minmax(0,1fr) 64px;gap:2px 8px;align-items:center;font-size:12.5px;padding:4px 0}
/* 帳場の .bar とは別。そちらの padding を継ぐと、border-box で塗り（i）の高さが 0 になる */
.mat .matbar{display:block;height:6px;padding:0;border:0;background:var(--panel2);border-radius:3px;overflow:hidden}
.mat .matbar i{display:block;height:100%;background:var(--amber)}
.mat>span:last-child{grid-column:2 / -1;font-size:11px}
.tiers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tblwrap{overflow-x:auto}
.maptbl{width:100%;border-collapse:collapse;font-size:12px}
.maptbl th{text-align:left;font-weight:400;color:var(--muted);font-size:11px;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.maptbl td{padding:4px 6px 4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.maptbl td.fl{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg)}
.maptbl tr.zone td{color:var(--amber);font-size:11px;letter-spacing:.1em;padding-top:10px;border-bottom:0}
.maptbl .mok{color:var(--heal);white-space:nowrap}
.maptbl .aff{color:var(--amber)}
.maptbl .mwip{color:var(--amber);white-space:nowrap}
.shoptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.shoptbl td{padding:4px 6px 4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.shoptbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--amber)}
.eqtab .lore{grid-column:2 / -1;color:var(--muted);font-size:11.5px;margin-top:-2px}
@media (max-width:480px){.eqtab>div{grid-template-columns:92px minmax(0,1fr)}.eqtab .st{grid-column:2;text-align:left}}
.oddmark{color:var(--rival);font-size:11px;margin-left:4px}
.ptag{display:inline-block;max-width:calc(100% - 4px);box-sizing:border-box;font-size:11px;line-height:1.45;margin-left:4px;padding:0 5px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;vertical-align:baseline}
.ptag.lead{color:var(--amber);border-color:var(--amber-dim)}
.ptag.none{border-style:dashed}
.c-members .lead{color:var(--amber);margin-right:2px}
.dream small{display:block;color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:10px 0}
.kv div{background:var(--panel2);border-radius:4px;padding:6px 8px;font-size:12px;color:var(--muted)}
.kv b{display:block;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:8px 0 0;padding:0;border-left:1px solid var(--line)}
.tl li{position:relative;padding:3px 0 7px 14px;font-size:13px;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.tl li::before{content:"";position:absolute;left:-4px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--amber-dim)}
.tl .d{color:var(--muted);font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums}
.does{display:block;color:var(--muted);font-size:12px}
/* 右の列の行と碑、地図の札、迷宮日報、一行の様子、手帳。語の途中では折らない。行より長い語だけ、収まるところで折る */
.row .who,.meta,.does,.stone,.mv,.news li>span:not(.d){word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
.nw{white-space:nowrap;overflow-wrap:normal}
.seats{display:flex;gap:3px;margin:2px 0 10px}
.seats i{width:14px;height:14px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.seats i.on{background:var(--amber-dim);border-color:var(--amber-dim)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--amber);color:#1b1309;padding:6px 14px;border-radius:4px;font-size:13px;z-index:11}
.quote.revive{font-weight:700;margin:6px 0}
.does.revive{font-weight:700}
.quote.revive.ok,.does.revive.ok{color:var(--heal)}
.quote.revive.ash,.does.revive.ash{color:var(--blood)}
.quote.revive.lost,.does.revive.lost{color:var(--ash)}
.quote.revive.ok{border-left:3px solid var(--heal)}
.quote.revive.ash{border-left:3px solid var(--blood)}
.quote.revive.lost{border-left:3px solid var(--ash)}
/* 幅900px以下。タブと返済の帯は画面下に固定し、ページ全体は動かさず中身だけ送る */
@media (max-width:900px){
  html{height:100%;overflow:hidden}
  /* 下の余白はタブと返済の帯と知らせの分。中身はその上だけをスクロールし、ボタンが帯に隠れない */
  body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:calc(var(--tabbar-h, 140px) + var(--paybar-h, 0px) + var(--toast-h, 0px))}
  .wrap{flex:1;min-height:0;overflow-x:clip;overflow-y:auto;padding-bottom:12px;scroll-behavior:auto}
  .toast{left:16px;right:16px;width:auto;transform:none;text-align:center;word-break:keep-all;line-break:strict;overflow-wrap:anywhere;bottom:calc(var(--tabbar-h, 140px) + var(--paybar-h, 0px) + 12px)}
  .side{position:static;max-height:none}
  /* ログの固定高さと、ページの中身のスクロールが重なって棒が二重に出るのを避ける */
  .c-log{height:min(380px,50dvh);max-height:50dvh}
  .payline:not([hidden]){position:fixed;left:0;right:0;top:auto;bottom:var(--tabbar-h, 140px);z-index:9;border-bottom:0;border-top:1px solid var(--line);box-shadow:0 -4px 12px #0006}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);border-bottom:0;padding:2px 4px 6px;box-shadow:0 -8px 20px #0008}
  .tbody{max-height:none;min-height:0;flex:none;overflow:visible;padding-bottom:0}
  .tbody>:last-child,.desk>:last-child{margin-bottom:0}
}
/* 幅640px以下。帳場は見出しの下にボタン、地図屋の階は1枚の札。押しやすい大きさは44px */
@media (max-width:640px){
  .tabs button,.ctrl .btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
  /* 帳場など右の列と、留守のあいだに。お金のボタンと、行の頭の名前は44px。横の間隔は .row の 8px */
  .tbody .btn,.modal .btn,.c-foot .btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
  .tbody .btn.pol{min-width:8em}
  .tbody .nm-head{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:44px;min-height:44px;padding:0 4px}
  /* 文の途中の名前。行の高さは変えず、上下の押し幅だけ広げる */
  .tbody .nm-link:not(.nm-head){display:inline;padding-block:12px;margin-block:-12px;vertical-align:baseline}
  /* 手帳の続柄。字が小さいので、上下の押し幅を少し多めにとる */
  .note .nm-link:not(.nm-head){display:inline;padding-block:14px;margin-block:-14px;vertical-align:baseline}
  .h2{flex-wrap:wrap;row-gap:2px;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
  .h2 span{flex:1 0 100%}
  .c-members{gap:0 10px}
  .c-members .m{min-height:44px;align-items:center}
  .c-members .nm-link{display:inline-flex;align-items:center;min-width:44px;min-height:44px;padding:0 4px;margin-left:-4px}
  /* 一言があるとき、稼ぎは一言の下の行。右端に寄せる */
  .c-foot:has(.c-warn) .c-loot{flex:1 0 100%;margin-left:0;text-align:right}
  .desk .row{align-items:flex-start}
  .desk .row>.who{flex:1 0 100%;width:100%;min-width:100%}
  .tblwrap:has(.mapfloors){overflow-x:visible}
  .mapfloors,.mapfloors tbody,.mapfloors tr,.mapfloors td{display:block;width:auto}
  .mapfloors thead{display:none}
  .mapfloors tr.zone{margin:12px 0 4px;padding:0;border:0;background:none}
  .mapfloors tr.zone td{padding:0;border:0}
  .mapfloors tr.flr{border:1px solid var(--line);border-radius:6px;padding:8px 10px 6px;margin:0 0 8px;background:var(--panel2)}
  .mapfloors tr.flr td{border:0;padding:2px 0}
  .mapfloors tr.flr td.fl{font-family:var(--f-display);font-size:15px;padding:0 0 4px;white-space:normal}
  .mapfloors .mok,.mapfloors .mwip{white-space:normal}
  .mapfloors tr.flr td[data-label]{display:grid;grid-template-columns:4.5em minmax(0,1fr);column-gap:8px;align-items:baseline}
  .mapfloors tr.flr td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:11px;word-break:keep-all}
  .mapfloors tr.flr td[data-label] .mv{min-width:0;word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
}
/* 右の列は370px。帳場の借金の行は、見出しを上、返すボタンを下に置く */
@media (min-width:901px){
  .desk .row.debt{align-items:flex-start}
  .desk .row.debt>.who{flex:1 0 100%;width:100%;min-width:100%}
}

const PT_B_JA=Object.fromEntries(PT_B.map(w=>[w.t,w.ja]));
function crestJa(name){
  if(typeof name!=='string')return '';
  const i=name.indexOf('・');
  if(i<1||name.indexOf('・',i+1)>=0)return '';
  const a=PT_A_JA[name.slice(0,i)],b=PT_B_JA[name.slice(i+1)];
  return a&&b?a+'の'+b:'';
}
function partyShown(name){const ja=crestJa(name);return ja?name+'（'+ja+'）':name}
// 文の中の紋章名に訳を添える。すでに付いていれば重ねない。白銀の牙・旧名・「の一行」はそのまま
function glossText(s){
  if(typeof s!=='string'||s.indexOf('・')<0)return s;
  const kata=ch=>/[\u30A1-\u30FC]/.test(ch);
  let out='',i=0;
  while(i<s.length){
    const j=s.indexOf('・',i);
    if(j<0){out+=s.slice(i);break;}
    let a0=j;while(a0>0&&kata(s[a0-1]))a0--;
    let b1=j+1;while(b1<s.length&&kata(s[b1]))b1++;
    const ja=crestJa(s.slice(a0,b1));
    if(!ja){out+=s.slice(i,j+1);i=j+1;continue;}
    const g='（'+ja+'）';
    out+=s.slice(i,b1);i=b1;
    if(s.startsWith(g,i)){out+=g;i+=g.length;}else out+=g;
  }
  return out;
}

/* ---- bonds between regulars, and templated chatter ---- */
function bkey(a,b){return a.id<b.id?a.id+'-'+b.id:b.id+'-'+a.id}
function bond(S,a,b){S.bonds=S.bonds||{};const k=bkey(a,b);return S.bonds[k]=S.bonds[k]||{n:0,ev:[]}}
function bondOf(S,a,b){return (S.bonds||{})[bkey(a,b)]}
function bondEv(S,a,b,e){if(!a||!b||a===b)return;const B=bond(S,a,b);e.tk=S.tick;B.ev.push(e);if(B.ev.length>6)B.ev.shift();}
function recordBonds(S,p,al,dead,share){
  const own=dead.filter(d=>p.members.includes(d.id));const all=al.concat(own);const f=p.trip.deep;const byN=n=>all.find(x=>x.name===n);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)if(all[i].tav===all[j].tav)bond(S,all[i],all[j]).n++;
  if(al.length)own.forEach(d=>{const c=al.reduce((m,x)=>x.mhp>m.mhp?x:m,al[0]);bondEv(S,c,d,{k:'carry',a:c.id,b:d.id,f:d.lastFloor||f});});
  if(p.trip.yomi){const c=byN(p.trip.yomi.c),d=byN(p.trip.yomi.d);bondEv(S,c,d,{k:'yomi',a:c&&c.id,b:d&&d.id,f});}
  const close=al.filter(a=>p.trip.close.includes(a.name));const hl=byN(p.trip.healer);
  if(close.length>=2)bondEv(S,close[0],close[1],{k:'close',f});
  if(close.length&&hl&&hl!==close[0])bondEv(S,hl,close[0],{k:'heal',a:hl.id,b:close[0].id,f});
  const rk=Object.entries(S.rares||{}).find(([rf,v])=>v.killed&&v.killed.party===p.name&&S.tick-v.killed.tk<TICKS_PER_DAY*6);
  if(rk&&al.length>=2){const R0=rareDef(+rk[0]);const m=R0?R0.n:'名のある魔物';const rf=+rk[0];
    const seen=(a,b)=>((bondOf(S,a,b)||{}).ev||[]).some(e=>e.k==='rare'&&e.m===m&&e.f===rf);
    const sl=rk[1].killed.by&&al.find(a=>a.name===rk[1].killed.by);
    // 討伐の場で残していれば足さない。by のない古い記録だけ、これまでどおり二人のあいだに残す
    if(sl)al.forEach(a=>{if(a!==sl&&!seen(sl,a))bondEv(S,sl,a,{k:'rare',m,f:rf,by:sl.id,t:`${m}討伐に加わった`});});
    else if(!('by' in rk[1].killed)&&!seen(al[0],al[1]))bondEv(S,al[0],al[1],{k:'rare',m,f:rf});}
  if(p.trip.rec&&al.length>=2)bondEv(S,al[0],al[1],{k:'rec',f});
  const big=p.trip.big?p.trip.big.n:null;const kills=Object.values(p.trip.kills||{}).reduce((x,y)=>x+y,0);
  all.forEach(a=>{a.last={deep:f,zone:zoneOf(f),mon:big,kills,traps:(p.trip.traps||[]).slice(0,2),loot:share,tk:S.tick,party:p.name,deaths:(p.trip.deaths||[]).map(x=>x.n).filter(n=>n!==a.name),fled:p.trip.fledFrom||null,died:own.includes(a)};});
}

  if(To.overtook&&recent(To.overtook))topics.push([3,()=>{say2(A,'聞いたか。街じゃ、ロウエンいちの酒場はここだって言われてるらしい');say2(B,pick(['開いたばかりの頃は、客が五、六人しかいなかったのにな','銀の杯亭の連中の顔が見ものだ']));}]);
  const q=QUIRKS[A.quirk];if(q)topics.push([1,()=>{const jokes={'酒好き':['もう一杯だけ付き合え','またか'],'猫好き':['見ろ、黒猫が俺の膝に','……引っかかれてるぞ'],'博打好き':['次の帰還が何日後か、賭けないか','やめとけ。縁起でもない'],'大食い':['お前、それ食わないのか？','やらんぞ'],'方向音痴':['厠はどっちだったかな','三度目だぞ、それ']};const j=jokes[A.quirk];if(j){say2(A,j[0]);say2(B,j[1]);}else{say2(A,pick(['今日は静かだな','いい夜だ']));say2(B,pick(REACT[B.pers]));}}]);
  const ot=ORIGIN_TALK[A.origin];if(ot)topics.push([2,()=>{const t=pick(ot);say2(A,t[0]);say2(B,pick(t[1]));}]);
  if(A.origin!==B.origin&&ORIGINS[A.origin]&&ORIGINS[B.origin]){const pair=[A.origin,B.origin].sort().join('|');
    const XO={'グラウ帝国|ラウレンツ王国':[['国境じゃ、またお前の国と小競り合いらしいな','ここじゃ同じ卓で飲んでるのにな'],['帝国の兵は、王国の騎士を見ると笑うそうだ','王国の騎士も、帝国の兵を見て笑ってるさ']],
      'セーレ自由都市同盟|聖オルド教国':[['教国の坊さんは、祈りより先に値段を言う','同盟の商人は、値段より先に利息を言う']],
      'カルセ王国|グラウ帝国':[['帝国は、カルセの麦がなけりゃ一冬ももたない','だから帝国は、カルセに手を出さないのさ']],
      'ラウレンツ王国|灰の荒野':[['王国の連中は、エスタリアの土地を勝手に「王国領」と呼んでる','……今さら、取り返す者もいないからな']]}[pair];

    if(ORIGINS[B.origin].far&&!ORIGINS[A.origin].far)topics.push([2,()=>{say2(A,`${B.origin}って、どんな所なんだ`);say2(B,pick(['海の向こうだ。帰るには、ひと財産いる','ここよりは暖かい。いや、寒いか……忘れたな','話しても信じないさ']));}]);}
  for(const [c,f] of [...RACE_TALK,...AGE_TALK,...SEX_TALK,...CLS_TALK])if(c(A,B))topics.push([1.5,()=>{const t=f(A,B);say2(A,t[0]);say2(B,t[1]);}]);

  L.forEach(l=>remember(S,S.adv[l.id],l.t));

function tick(S){
  S.tick++;flowRoll(S);edictTick(S);mapTick(S);chatterTick(S);debtTick(S);rivalTick(S);
  for(const p of Object.values(S.parties)) stepParty(S,p);
  for(const tav of ['ours','rival']){
    if(chance(.12)) formParties(S,tav);
    const rate=(tav==='ours'?0.016+Math.min(S.taverns.ours.rep,200)*0.00008:0.018)*(edict(S,'mercs')?1.8:1);
    if(seatsUsed(S,tav)<seatCap(S,tav)&&chance(rate)){const a=makeAdv(S,tav,Object.assign({lvl:newcomerLvl(S,tav)},edict(S,'mercs')&&chance(.5)?{origin:'グラウ帝国',race:'人間'}:{})); if(tav==='ours'&&policy(S).rookie&&a.lvl<10){for(let k=0;k<2;k++){const o=giftOffer(S,a);if(!o||o.price>incomeAt(depthOf(a)+2)*3)break;giveGift(S,a,o,'店主から支度の品として');}}
      if(tav==='ours'){const ev=ourNewcomerNews(a);news(S,ev.t,ev.k);}
      else if(a.odd||CLS[a.cls].rare) news(S,`噂：銀の杯亭に${a.race}の${a.cls}が現れたらしい。`,'rumor');}
  }
  if(S.tick%(TICKS_PER_DAY*365)===0){
    Object.values(S.adv).forEach(a=>{if(a.status!=='lost'&&a.status!=='retired'&&a.age)a.age++;});
    news(S,`迷宮暦${81+Math.floor(S.tick/TICKS_PER_DAY/365)}年が明けた。冒険者たちはひとつ歳をとる。`,'info');
  }
  // temple on credit after a long wait (ours)
  for(const a of Object.values(S.adv)){
    if(a.tav!=='ours'||(a.status!=='dead'&&a.status!=='ash'))continue;
    a.tw=(a.tw||0)+1;
    if(policy(S).revive&&S.taverns.ours.gold>=templeCost(S,a)){payRevive(S,a,a.party&&S.parties[a.party]);continue;}
    if(a.tw>120){a.tw=0;const cost=templeCost(S,a);a.gold-=cost;chron(S,a,`寺院に${cost}Gの借りを作って蘇生を受ける`);temple(S,a,true);}
  }
  // the dungeon swallows parties nobody recovers. 遺体を運んでいる途中の一行は、運び手が帰るまでこの時計を止める
  for(const p of Object.values(S.parties)){
    if(p.state==='wiped'&&!p.retrieved&&S.tick-p.wipedAt>1000){
      // 巡回隊が届くのは、その探索先でこれまでに到達した最深階から PATROL_DEPTH 階上まで。それより深ければロスト
      const top=inMine(p.floor)?MAXF+Math.max((S.mineDeep||{}).ours||0,(S.mineDeep||{}).rival||0):Math.max(S.deepest.ours,S.deepest.rival);
      if(p.floor<=top-PATROL_DEPTH){corpsesHome(S,p,'巡回隊が見つけ、',null);continue;}
      if(!p.announced)p.announced=true;
      // 消えた者の名を二つ名つきで並べる。名前は日報で一続きになる（記念碑の名が知らせの語になる）
      const names=p.members.map(id=>A(S,id)).filter(Boolean).map(full);
      // 見送りの一行は、消えた者全員の絆の中から一つ決め、知らせ1件に一行だけ添える。記念碑には消えた者それぞれに同じ一行を残す
      const farewell=farewellLine(S,p.members.map(id=>A(S,id)).filter(a=>a&&a.status==='missing'));
      p.members.forEach(id=>{const a=A(S,id);if(a.status!=='missing')return;a.status='lost';a.party=null;chron(S,a,`${FN(p.floor)}から戻ることなく、迷宮に呑まれる`);
        memorialize(S,a,{by:a.lastBy||p.killer||'不明',floor:p.floor,farewell});});
      news(S,`${S.taverns[p.tav].name}の${p.name}は、ついに見つからなかった。${FN(p.floor)}に消えた${names.join('、')}の${names.length>1?`${names.length}人の`:''}名が記念碑に刻まれる。${farewell}`,'lost');
      if(S.bounties[p.id]){S.taverns.ours.gold+=S.bounties[p.id];news(S,`${p.name}の死体回収の依頼を取り下げ、預けていた${S.bounties[p.id]}Gが戻った。`,'info');}
      delete S.bounties[p.id];delete S.parties[p.id];
    }
  }
  // delayed realisation of missing parties
  for(const p of Object.values(S.parties)){
    // 予定帰還の刻を過ぎて MISSING_GRACE 刻たったら消息不明。死因と階は、遺体が街に着くまで知らせない
    if(p.state==='wiped'&&!p.announced&&S.tick>=(p.dueAt||p.wipedAt)+MISSING_GRACE){
      p.announced=true;
      const WHY={race:'銀の杯亭に先を越されまいと深く潜った',first:'一番乗りを狙って最前線に挑んだ',bounty:'王国の報奨金を狙って無理をした',dream:'仲間の夢のために深みを目指した',avenge:'仇の魔物を追って深みに踏み込んだ',errand:'店主に回された話を果たしに向かった',boss:'坑道王を討ちに底へ向かった'};
      if(p.tav==='ours') news(S,`${p.name}が予定を過ぎても戻らない。${p.pushWhy?WHY[p.pushWhy]+'という。':''}${inMine(p.floor)?'坑道':'迷宮'}に入ったきり、消息が知れない。`,'death');
      else {news(S,`噂：銀の杯亭の${p.name}が、${inMine(p.floor)?'坑道':'迷宮'}から戻らないらしい。${p.pushWhy==='race'?'黒猫亭に負けまいと焦ったのだろう、と皆が言う。':p.pushWhy==='bounty'?'報奨金に目がくらんだのだろう。':''}`,'rumor');
        if(S.ace===p.id){p.ace=false;S.ace=null;pickAce(S);}}
    }
  }
  owedTick(S);releaseRetrieved(S);
  errandTick(S);mineTick(S);
  checkMemo(S);
  letterTick(S);kinTick(S);
}

function stepParty(S,p){
  if(p.state==='wiped') return;
  if(p.state==='town'){
    p.rest--; if(p.rest>0) return;
    // 遺体がまだ迷宮にあるあいだは、別の仲間を集めて先に潜らない
    if(Object.values(S.adv).some(a=>a.party===p.id&&a.status==='missing')) return;
    let roster=Object.values(S.adv).filter(a=>a.party===p.id&&a.status!=='lost'&&a.status!=='retired'&&a.status!=='missing');
    roster.filter(a=>a.tav!==p.tav).forEach(a=>{a.party=null;});roster=roster.filter(a=>a.tav===p.tav);
    let L=A(S,p.leader);
    if(!p.leader&&roster.length){p.leader=roster.slice().sort((x,y)=>leaderScore(y)-leaderScore(x))[0].id;L=A(S,p.leader);}
    if(!L||L.party!==p.id||L.status==='lost'||L.status==='retired'||L.tav!==p.tav){if(!succession(S,p,roster.filter(a=>a!==L),L))return;L=A(S,p.leader);roster=roster.filter(a=>a.party===p.id);}
    p.size=6;
    if(roster.length>6){roster.sort((x,y)=>y.lvl-x.lvl);roster.slice(6).forEach(a=>{if(a===L)return;a.party=null;chron(S,a,`人数が多すぎて${p.name}を離れる`);});roster=roster.filter(a=>a.party===p.id);}
    if(roster.length<p.size){const extra=freeAdv(S,p.tav).filter(a=>a.party!==p.id&&Math.abs(PL(a)-PL(L))<=6).sort((x,y)=>{const bx=bondOf(S,L,x),by=bondOf(S,L,y);return ((by?by.n:0)-(bx?bx.n:0))||(Math.abs(PL(x)-PL(L))-Math.abs(PL(y)-PL(L)));});
      while(roster.length<p.size&&extra.length){const a=extra.shift();a.party=p.id;roster.push(a);plog(p,`${a.name} が なかまに くわわった`,'sys');chron(S,a,`${L.name}に誘われ、${p.name}に加わる`);if(p.tav==='ours')news(S,`${L.name}が、${a.name}を${p.name}に迎え入れた。`,'info');}}
    let ms=roster.filter(a=>a.status==='idle');
    const allIn=ms.length===roster.length;
    // 寺院で眠る仲間まで数えて6人いるなら、欠けたまま出ずに全員の戻りを待つ
    const full=roster.length>=p.size;
    if(ms.length>=3&&(allIn||(!full&&(p.wait||0)>150))&&(ms.includes(L)||(p.wait||0)>300)){
      p.wait=0;
      p.members=ms.map(a=>a.id); ms.forEach(a=>{a.status='party'});
      Object.assign(p,{floor:1,state:'explore',steps:0,fsteps:0,loot:0,carried:[],trip:newTrip(),rescue:[],tmap:{},guard:0,ward:0,star:0,announced:false,knownWiped:false,retrieved:false,cause:'',causeTold:false,dueAt:0});
      p.mineTrip=wantsMine(S,p);
      plog(p,'――――――――――','move'); plog(p,`${p.mineTrip?'こうどう':'めいきゅう'}へ しゅっぱつした`,'sys');supplyTeam(S,p);setPlan(S,p);
      if(p.mineTrip){const lim=Math.min(Math.floor(safeFloor(S,p)),p.cap||99);const st=MINE_STONES.filter(x=>x<=(p.mineReach||0)&&fx(x)<=lim).pop()||MINE_TOP;
        p.floor=st;p.trip.deep=st;plog(p,`てんいの せきひで てつの さんみゃくの ${FN(st)} へ（${zoneOf(st)}）`,'sys');floorArrive(S,p);reachFloor(S,p,false);}
      else{const pe=partyErrand(S,p);const lim=Math.min(p.reach||0,Math.floor(safeFloor(S,p)),p.cap||99,pe?pe.f:99);const st=STONES.filter(x=>x<=lim).pop();
        if(st){p.floor=st;p.trip.deep=st;plog(p,`てんいの せきひで ${FN(st)} へ（${zoneOf(st)}）`,'sys');}
        floorArrive(S,p);}
      noteKnownDepth(p);noteDepart(S,p);
    } else {
      p.wait=(p.wait||0)+1;
      if(p.wait>450&&ms.length<3){disbandParty(S,p,'仲間がそろわず');}
    }
    return;
  }
  // poison tick
  if(S.tick%2===0) for(const a of alive(S,p)) if(a.poison&&a.hp>1){a.hp-=1;}
  if(!alive(S,p).length){wipe(S,p,'どく');return;}
  if(p.enemies){combat(S,p);return;}
  // 戦いのない歩みごとに、水晶の記録の位置と体力を控える。まだ知れていない全滅の水晶は、ここまでを映す
  if(p.tav==='ours'){p.calmLc=p.lc||0;p.calmHp=p.members.map(id=>{const a=A(S,id);return a?a.hp:0;});}
  p.steps++;
  if(p.state==='return'){
    if(p.floor>=6&&hpRatio(S,p)<.35){const c=alive(S,p).find(a=>CAN.dasshutsu(a)&&a.mp>=3);if(c){escape(S,p,c);return;}}
    if(chance(.18)){encounter(S,p);return;}
    findCorpses(S,p,.02);
    if(chance(.3)){
      if(STONES.includes(p.floor)||MINE_STONES.includes(p.floor)||p.floor===MINE_TOP){plog(p,`てんいの せきひに ふれた……ちじょうへ`,'sys');p.floor=0;arrive(S,p);return;}
      p.floor--;
      if(p.floor<=0){arrive(S,p);return;}
      plog(p,`かいだんを のぼった……${FN(p.floor)}`,'move');
    } else plog(p,pick(MOVE),'move');
    return;
  }
  // explore
  p.fsteps++;
  const pers=PERS[leader(S,p).pers]; const r=hpRatio(S,p);
  const al=alive(S,p);
  const casters=al.filter(a=>C(a).heal);
  const healLeft=casters.reduce((s,a)=>s+a.mp,0);
  const owe=p.tav==='rival'&&al.some(a=>(a.debt||0)>0);
  const th=retreatLine(S,p);
  const lostOne=(al.length<p.members.length||al.some(a=>a.hp<a.mhp*.2))&&leader(S,p).pers!=='無謀';
  let goHome = r<th || lostOne || al.length<=Math.ceil(p.members.length/2) || p.steps>(p.plan==='grind'?220:160) || (healLeft===0&&r<th+.2&&casters.length>0);
  if((p.carried||[]).length&&!goHome) goHome=true;
  if(goHome){
    p.state='return'; say(S,p,RET[leader(S,p).pers]); return;
  }
  if(r<.5&&PUSH[leader(S,p).pers]&&chance(.3)) say(S,p,PUSH[leader(S,p).pers]);
  if(chance(.07)){const q=pick(al);plog(p,pick(QUIRKS[q.quirk].d).replace('{n}',q.name),'say');}
  for(const a of al){const d=a.dream;if(d&&!d.done&&d.k==='kin'&&p.floor===d.f&&chance(d.hint?.024:.012)){kinEvent(S,p,a);return;}}
  const pe=partyErrands(S,p).find(e=>e.f===p.floor);
  if(pe&&chance(.1)){errandEvent(S,p,pe);return;}
  const roll=R();
  if(roll<(hasMap(p)?.30:isFrontier(S,p.floor)?.30:.24)){encounter(S,p);return;}
  if(findCorpses(S,p,.08)) return;
  if(roll<.42){meetParty(S,p);return;}
  loreCheck(S,p);
  const safe=safeFloor(S,p);
  if(p.fsteps>=stairSteps(p)&&p.floor<(inMine(p.floor)?MINE_BOT:MAXF)&&!pe&&fx(p.floor)<Math.min(p.cap||99,Math.max(safe+(owe?.7:0)+(p.plan==='push'?(p.pushWhy?1:.5):0),p.plan==='push'&&p.pushTo?p.pushTo:0))&&r>pers.th-(owe?.06:0)+.25&&chance(.3)){
    if(p.floor===DRAGON_F&&dragonAlive(S)){say(S,p,DESC[leader(S,p).pers]);dragonEncounter(S,p);return;}
    say(S,p,DESC[leader(S,p).pers]);
    p.floor++;p.fsteps=0;p.trip.deep=Math.max(p.trip.deep,p.floor);
    floorThrough(S,p,p.floor-1);
    plog(p,`かいだんを おりた……${FN(p.floor)}`,'sys');
    floorArrive(S,p);if(isFrontier(S,p.floor))plog(p,'だれも しらない かいだ。くうきが ちがう','death');else if(!hasMap(p))plog(p,'ちずの ない かいだ。しんちょうに すすめ','move');
    reachFloor(S,p,false);
    return;
  }
  plog(p,pick(MOVE),'move');
}

function meetParty(S,p){
  const o=Object.values(S.parties).find(q=>q!==p&&q.floor===p.floor&&(q.state==='explore'||q.state==='return')&&!q.enemies);
  if(!o){plog(p,pick(MOVE),'move');return;}
  const lines=['ぶじで なにより','このさき オークの むれが いたぞ','たからばこは もう からだ。おそかったな','……みない かおだな','そっちは どうだ'];
  plog(p,`${o.name}${o.tav!==p.tav?'（'+S.taverns[o.tav].name+'）':''} と すれちがった`,'sys');
  plog(p,`${leader(S,o).name}「${pick(lines)}」`,'say');
  plog(o,`${p.name}${o.tav!==p.tav?'（'+S.taverns[p.tav].name+'）':''} と すれちがった`,'sys');
  if(p.trip.met)p.trip.met.push({n:o.name,rival:o.tav!==p.tav});if(o.trip&&o.trip.met)o.trip.met.push({n:p.name,rival:o.tav!==p.tav});
  if(o.tav!==p.tav){o.seen=S.tick;p.seen=S.tick;}
}

function findCorpses(S,p,base){
  // すでに誰かが運んでいる一行（retrieved）は除く
  const w=Object.values(S.parties).find(q=>q.state==='wiped'&&!q.retrieved&&q.floor===p.floor&&q!==p);
  if(!w) return false;
  const bounty=S.bounties[w.id];
  if(!chance(base+(bounty?.12:0))) return false;
  const lp=leader(S,p);
  plog(p,`たおれている いっこうを みつけた……${w.name}だ`,'death');
  p.trip.found.push(w.name);
  const greedy=lp.pers==='強欲'&&!bounty;
  if(greedy&&chance(.6)){
    plog(p,`${lp.name}「……そうびだけ いただいていく」`,'say');
    let got=[];
    for(const id of w.members){const a=A(S,id);
      eqList(a).forEach(it=>{const tgt=giveBest(S,alive(S,p),it,p);if(tgt){a.eq[it.slot]=null;got.push(it.n);chron(S,tgt,`${FN(p.floor)}で帰らぬ${a.name}の${it.n}を拾う`);chron(S,a,`遺体から${it.n}を${p.name}の${tgt.name}に持ち去られる`);if(got.length===1||it.rare)news(S,`${p.name}の${tgt.name}が、帰らぬ${a.name}の${it.n}を拾い、身につけた。`,'loot');}});
      p.loot+=Math.max(0,a.gold); a.gold=Math.min(0,a.gold);}
    w.looted=true;
    return true;
  }
  plog(p,`${lp.name}「つれて かえろう」`,'say');
  for(const id of w.members){if(!(p.carried||[]).includes(id))p.carried.push(id); const a=A(S,id);if(!a)continue;a.carriedBy=p.id; chron(S,a,`${p.name}に遺体を見つけられ、街へ運ばれる`);}
  // 階も相手も、街に着くまで知らせない。伏せ中なら知らせ自体を出さない

function title(S,a,quiet){
  const ach=[];

  if(a.revived>=3)ach.push('rev2');if(a.kills>=500)ach.push('k300');if((a.slain||{})['黒竜'])ach.push('dragon');if(a.revived>=5)ach.push('rev3');
  if(eqList(a).some(it=>it.rare))ach.push('item');if(a.conq)ach.push('conq');if((a.mineDeep||0)>=13)ach.push('mdeep');if(a.mconq)ach.push('mconq');if((a.errandsDone||0)>=3)ach.push('errand');
  if(!ach.length)return;
  const top=Math.max(...ach.map(k=>TITLE_TIER[k]));if(a.titleKind&&(TITLE_TIER[a.titleKind]||0)>=top)return;
  const others=Object.values(S.adv).filter(b=>b!==a&&b.title&&b.status!=='lost'&&b.status!=='retired');
  const taken=new Set(others.map(b=>b.title)),stems=new Set(others.map(b=>b.titleStem).filter(Boolean));
  const kinds=ach.filter(k=>TITLE_TIER[k]===top).sort(()=>R()-.5).concat(ach.filter(k=>TITLE_TIER[k]===top-1).sort(()=>R()-.5));
  let t=null,st=null,kind=null;
  for(const k of kinds){const c=titleCands(S,a,k).filter(c=>c&&c[1]).sort(()=>R()-.5).find(c=>!stems.has(c[0])&&!taken.has(c[1]));if(c){t=c[1];st=c[0];kind=k;break;}}
  if(!t){const adj=(a.traits||[]).map(x=>TITLE_ADJ[x]).filter(Boolean).concat([ORIGINS[a.origin]?ORIGINS[a.origin].short+'の':'']);kind=kinds[0];
    for(const c of titleCands(S,a,kind).sort(()=>R()-.5)){for(const ad of adj){if(ad&&!taken.has(ad+c[1])){t=ad+c[1];st=c[0]+'+'+ad;break;}}if(t)break;}}
  if(!t||(a.titleKind===kind&&a.title))return;
  a.titleStem=st;a.title=t;a.titleKind=kind;a.titleTier=TITLE_TIER[kind];if(quiet)return;chron(S,a,`「${t}」と呼ばれはじめる`);news(S,`${S.taverns[a.tav].name}の${a.name}が「${t}」と呼ばれはじめた。`,'record');
}

// 次の返済日に払う額と、そこまでの日数。借金が残っていなければ出さない。当日は1日と数える

// 古い記録で、分かるものだけ日付を戻す。分からない行は null（線だけ）
function memoWhen(S,id){
  const T0=S.taverns.ours;
  if(id==='bill')return T0.cleanPay!=null?T0.cleanPay:(T0.debtFree!=null?T0.debtFree:null);
  if(id==='free')return T0.debtFree!=null?T0.debtFree:null;
  if(id==='rare'){let tk=null;Object.values(S.rares||{}).forEach(v=>{const k=v&&v.killed;if(k&&k.tav==='ours'&&k.tk!=null&&(tk==null||k.tk<tk))tk=k.tk;});return tk;}
  if(id==='dream'){let tk=null;Object.values(S.adv||{}).forEach(a=>{if(!a||a.tav!=='ours')return;(a.pastDreams||[]).forEach(d=>{if(d&&d.tk!=null&&(tk==null||d.tk<tk))tk=d.tk;});});return tk;}
  if(id==='stone'){let tk=null;Object.values(S.adv||{}).forEach(a=>{if(!a||a.tav!=='ours')return;(a.chron||[]).forEach(c=>{if(c&&c.t==='はじめてB6Fに足を踏み入れる'&&c.tk!=null&&(tk==null||c.tk<tk))tk=c.tk;});});return tk;}

function memoStamp(S,id,live){const tk=memoWhen(S,id);if(tk!=null)return tk;return live?S.tick:null;}
// quiet のときは線だけ引き、評判は足さない（古い記録を開いたとき）
function checkMemo(S,quiet){

  const T0=S.taverns.ours;

}
// 帳場に出す行。未達の先頭3行と、いちばん新しくかなえた行（同じ日ならその日の分すべて）
function memoState(S){
  const done=(S.memo&&S.memo.done)||{};
  const row=m=>{const d=done[m.id];return {id:m.id,t:m.t,rep:m.rep,done:!!d,tk:d?d.tk:null};};
  const log=MEMO.filter(m=>done[m.id]).map(row);const open=MEMO.filter(m=>!done[m.id]);
  if(!open.length)return {show:[],log,allDone:true};
  let keep=[];
  if(log.length){const known=log.map(m=>m.tk).filter(t=>t!=null);if(known.length){const mx=Math.max(...known);keep=log.filter(m=>m.tk===mx);}else keep=[log[log.length-1]];}
  const ids=new Set(keep.map(m=>m.id));open.slice(0,3).forEach(m=>ids.add(m.id));
  return {show:MEMO.filter(m=>ids.has(m.id)).map(row),log,allDone:false};
}
function nearestMemo(S){return memoState(S).show.find(m=>!m.done)||null;}
function memoUnseen(S){const seen=(S.memo&&S.memo.seen)||{};return memoState(S).show.some(m=>!seen[m.id]);}
function markMemoSeen(S){const st=memoState(S);if(!st.show.length)return false;S.memo=S.memo||{done:{}};S.memo.seen=S.memo.seen||{};let ch=false;for(const m of st.show){if(!S.memo.seen[m.id]){S.memo.seen[m.id]=1;ch=true;}}return ch;}
function moveTav(S,a,tav){const team=a.party&&S.parties[a.party];if(team&&team.state!=='town')return false;

function smallEvent(S){const list=smallOf(S);

function newsChunk(text,i,terms){
  let hit='';
  for(const term of terms){if(text.startsWith(term,i)){hit=term;break;}}
  const c=text.charCodeAt(i);
  if(c>=0x30A0&&c<=0x30FF){
    const m=/^[ァ-ヶー]+・[ァ-ヶー]+（[^）]*）/.exec(text.slice(i));
    if(m&&m[0].length>hit.length){const raw=m[0].slice(0,m[0].indexOf('（'));if(crestJa(raw))hit=m[0];}
  }
  if(!hit){
    const ch=text[i];
    if((ch>='0'&&ch<='9')||ch==='-'||(ch==='L'&&text.startsWith('Lv',i))){
      const m=/^(?:Lv\d+|-?\d+\s*G|\d+歳相当|\d+歳|\d+日目|\d+部)/.exec(text.slice(i));
      if(m)hit=m[0];
    }
  }
  return hit;
}

}

  const upto=p.calmLc!=null?p.calmLc:0;const out=p.log.filter(l=>l.n<=upto).map(l=>({t:l.t,k:l.k}));
  const n=Math.max(0,Math.floor((S.tick-(p.wipedAt||S.tick))/2));let told=false;
  for(let i=Math.max(0,n-60);i<n;i++){const tk=(p.wipedAt||0)+2*(i+1);
    if(p.hideRecall&&!told&&tk>=p.hideRecall){told=true;out.push({t:'でんしょばとが まいおりた。「すぐ もどれ」',k:'sys'});}
    out.push({t:MOVE[((p.id|0)*31+i*17)%MOVE.length],k:'move'});}
  if(p.hideRecall&&!told)out.push({t:'でんしょばとが まいおりた。「すぐ もどれ」',k:'sys'});
  return out;}

}
function autoWatch(){
  S.taverns.ours.crystals=1;S.sel=0;S.watch.length=1;
  for(let i=0;i<S.watch.length;i++){
    const p=S.parties[S.watch[i]];
    const stale=!p||(p.state==='town'&&p.rest<4)||(p.tav==='rival'&&!visible(p));
    if(stale){
      const cand=Object.values(S.parties).filter(q=>q.tav==='ours'&&(q.state==='explore'||q.state==='return')&&!S.watch.includes(q.id));
      if(cand.length) S.watch[i]=cand[0].id; else if(!p) S.watch[i]=null;
    }

}

function stateText(p){
  if(p.state==='wiped'){
    // まだ知れていない全滅は、生きている一行と同じ様子で出す（階と死因は遺体が着くまで出さない）
    if(wipeHidden(p)&&p.hideRecall) return [`${FN(p.floor)} 帰還中`,false];
    if(wipeHidden(p)) return [`${FN(p.floor)} ${p.plan==='grind'?'腕を磨いている':p.plan==='push'?'深く攻めている':'探索中'}`,false];
    if(p.tav==='ours') return p.knownWiped?[`全滅（${FN(p.floor)}）`,true]:[`消息不明（${inMine(p.floor)?'坑道':'迷宮'}）`,true];
    return [`消息不明（噂）`,true];
  }
  if(p.state==='town') return [(p.wait||0)>10?'仲間の回復を待っている':'酒場で休息中',false];
  if(p.enemies) return [`${FN(p.floor)} 戦闘中`,false];
  if(p.state==='return') return [`${FN(p.floor)} 帰還中`,false];
  return [`${FN(p.floor)} ${p.plan==='grind'?'腕を磨いている':p.plan==='push'?'深く攻めている':'探索中'}`,false];
}
// 札の様子と色。'bad' は赤、'ret' は琥珀。帰り道を歩く一行は、全滅が近いときだけ赤にする
function partyStatus(p){
  const [st,bad]=stateText(p);
  if(p.tav!=='ours'||(p.state==='wiped'&&!wipeHidden(p))||p.state==='town')return [st,bad?'bad':''];
  const d=wipeHidden(p)?null:partyDanger(S,p);
  let text=st,mark=bad;
  if(d&&d.card){text+='・'+d.card;mark=true;}
  if(partyOverdue(S,p)){text+='・まだ戻らない';mark=true;}
  if(!mark)return [text,''];
  if(p.state!=='return'||p.enemies)return [text,'bad'];
  return [text,returnPeril(S,p)?'bad':'ret'];
}

function partyMembers(p){

function partyDepth(p){
  // 消息不明のあいだ（知れたあと、死因と階が届くまで）は、出発のときの到達で出す。倒れた階を漏らさない
  const k=p.trip&&p.trip.known;
  if(wipeUnknown(p)&&!wipeHidden(p)){
    // 控えのない古い記録は、到達済みの石碑まで丸める
    const lab=k?k.reach:(STONES.filter(x=>x<=(p.reach||0)).pop()||0),mine=k?k.mineReach:(MINE_STONES.filter(x=>x<=(p.mineReach||0)).pop()||0);
    return {lab,mine,key:Math.max(lab?fx(lab):0,mine?fx(mine):0)};}
  let lab=p.reach||0,mine=p.mineReach||0;
  if(p.floor>0){if(inMine(p.floor))mine=Math.max(mine,p.floor);else lab=Math.max(lab,p.floor);}
  return {lab,mine,key:Math.max(lab?fx(lab):0,mine?fx(mine):0)};
}

  ({'エルフ':['窓辺で月を眺めている','人間の歌を書き留めている'],'ドワーフ':['樽の酒を飲み比べている','斧の刃を研いでいる'],'ホビット':['三皿目の料理に取りかかっている','ポケットから何か取り出しては眺めている']}[a.race]||[]).forEach(x=>opts.push(x));
  ({'ハザン草原':['馬具の手入れをしている'],'東方の島国アズマ':['海の方角を向いて、静かに茶を飲んでいる'],'セーレ自由都市同盟':['帳面に稼ぎをつけている'],'聖オルド教国':['食前の祈りを長々と唱えている'],'灰の荒野':['荒野の古い歌を口ずさんでいる'],'グラウ帝国':['背筋を伸ばして、黙々と食べている']}[a.origin]||[]).forEach(x=>opts.push(x));
  if((a.favor||0)>=2)opts.push('店主に贈られた装備を磨いている','店主に礼を言って、多めに注文している');
  if(a.gold>20000)opts.push('金貨を積み上げて眺めている','皆に一杯おごっている');
  const lastc=(a.chron||[]).slice(-1)[0];if(lastc&&S.tick-lastc.tk<2*TICKS_PER_DAY){if(/息を吹き返す|よみがえる/.test(lastc.t))opts.push('寺院帰りで顔色が悪い','生き返った実感がないと呟いている');if(/レベル/.test(lastc.t))opts.push('新しい技を試したくてうずうずしている');}
  if(a.dream&&MONEY_DREAMS.includes(a.dream.k))opts.push('故郷宛ての手紙を書いている','稼ぎを数えて、ため息をついている');
  if(a.dream&&a.dream.k==='kin')opts.push(`古い似顔絵を眺めている。${a.dream.who}のものらしい`);
  if(!opts.length)return '';
  return opts[(a.id*7+day(S)*3+Math.floor(S.tick/20))%opts.length];
}
function dreamProgress(a){
  const d=a.dream;if(!d||!DREAMS[d.k])return '';
  return DREAMS[d.k].prog?DREAMS[d.k].prog(a,d,S):'';
}
let advOpen=null;

  box.innerHTML=groupMoney(`<div class="adv-h"><h2>${a.title?`<span class="ttl">「${esc(a.title)}」</span>`:''}${esc(a.name)}</h2><span class="chip ${shownStatus(a)}">${status}</span>${teamTag(a)}${markTag(a)}${a.opening?'<span class="markmark">開店からの常連</span>':''}${canMark?`<button class="btn sm markbtn" data-act="mark" data-a="${a.id}" ${markFull?'disabled':''}>${a.marked?'見込みを外す':'見込む'}</button>`:''}</div>

  ${pe?`<div class="dream"><small>回すつもりの話（次に酒場で会えたら伝える）</small>「${esc(pe.n)}」${FN(pe.f)}・掲示はあと${Math.max(1,Math.ceil((pe.until-S.tick)/TICKS_PER_DAY))}日</div>`:''}
  <div class="adv-sub">${S.taverns[a.tav].name}の客・出身：${esc(originOf(a))}${a.origin&&ORIGINS[a.origin].far?'（大陸の外）':''}・${sexAgeHtml(a)}${a.race!=='人間'?nw('（実年齢'+a.age+'歳）'):''}・${nw('Lv'+a.lvl)}（${rankOf(a.lvl)}） ${nw(a.race+'の'+a.cls)}・${a.pers}・${esc(a.quirk)}・素質「${a.tal}」<br>${esc(a.bg)}<br>口調：${esc(a.tone||'普通')}・口癖「${esc(a.catch||'')}」・好物：${esc(a.food||'')}${a.fear?'・怖いもの：'+esc(a.fear):''}</div>
  ${kinNote(a)}
  ${(a.traits||[]).length?`<div class="dream${a.blessed?' odd':''}"><small>${a.blessed?'天に愛された者・':a.cursed?'星回りの悪い者・':''}得意と不得意</small>${trGood(a).map(t=>`<b>${t}</b>　${esc(TRAITS[t].d)}`).join('<br>')}${trGood(a).length&&trBad(a).length?'<br>':''}${trBad(a).map(t=>`<span style="opacity:.75">${t}</span>　${esc(TRAITS[t].d)}`).join('<br>')}</div>`:''}
  ${(a.changes||[]).length?`<div class="dream"><small>変わったこと</small>${a.changes.map(c=>`${Math.floor(c.tk/TICKS_PER_DAY)+1}日目　${esc(c.t)}`).join('<br>')}</div>`:''}
  ${a.odd?`<div class="dream odd"><small>異例の冒険者</small>${esc(ODD_PERK[a.race]||'')}</div>`:''}
  ${C(a).adv||C(a).rare?`<div class="dream cls"><small>${C(a).rare?'レア職業':'上級職（'+esc(a.promoted||C(a).adv)+'から転職）'}・${esc(a.cls)}</small>${esc(C(a).desc)}${a.beast?`<small>相棒：${esc(a.beast.kind)}の${esc(a.beast.name)}</small>`:''}</div>`:''}
  <div class="note">${a.race}：得意　${esc(rc(a).good)}／苦手　${esc(rc(a).bad)}${a.odd?'（克服している）':''}</div>
  ${d?`<div class="dream"><small>夢</small>${esc(dreamText(d))}${dreamProgress(a)?`<small>${esc(dreamProgress(a))}</small>`:''}</div>`:`<div class="dream"><small>夢</small>${a.status==='lost'||a.status==='retired'?'――':'次の夢を探している'}</div>`}
  ${(a.pastDreams||[]).map(x=>`<div class="dream done"><small>${dreamSeen(a,x)?'見届けた夢':'かなえた夢'}・${Math.floor(x.tk/TICKS_PER_DAY)+1}日目</small>${esc(x.t)}${x.note?`<small>${esc(x.note)}</small>`:''}</div>`).join('')}
  <div class="kv"><div><b>${a.kills}</b>討伐</div><div><b>${deepNow(a.deepest)}</b>最深到達</div><div><b>${a.revived}</b>蘇生</div><div><b>${a.disarms}</b>罠解除</div>${a.errandsDone?`<div><b>${a.errandsDone}</b>果たした話</div>`:''}<div><b>${a.gold}G</b>所持金</div>${(()=>{const hp=shownHp(a);return hp.hide?'':`<div><b>${esc(hp.label)}</b>HP</div>`;})()}</div>
  <div class="eqtab">${SLOTS.map(k=>{const it=a.eq&&a.eq[k];const two=k==='shield'&&a.eq&&a.eq.wpn&&a.eq.wpn.two;
    return `<div><span class="sl">${SLOT_N[k]}${k==='wpn'&&it?(it.two?'（両手）':'（片手）'):''}</span><span class="${it&&it.rare?'rare':''}">${it?esc(it.n):two?'――（両手持ち）':'<span class="none">ありあわせ</span>'}</span><span class="st">${it?esc(itemStat(it)):''}</span>${it&&it.lore?`<span class="lore">${esc(it.lore)}</span>`:''}</div>`}).join('')}</div>
  <div class="note">攻撃 ${atkOf(a)}・守り ${acOf(a)}・MP ${mmpOf(a)}${a.loan?'・店から借りた装備あり':''}　所属：${esc(team)}${a.party&&S.parties[a.party]&&S.parties[a.party].leader===a.id?'（リーダー）':''}</div>
  <h3 class="h2" style="margin-top:14px">手帳</h3>

  box.scrollTop=st;

function toast(t){
  let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}
  el.textContent=groupMoney(t);clearTimeout(toastT);toastT=setTimeout(()=>{el.remove();document.documentElement.style.removeProperty('--toast-h');},2200);
  // 帯と知らせの分だけ下を空ける。それでもボタンが重なれば、その上までスクロールする
  requestAnimationFrame(()=>{
    if(!el.isConnected||!matchMedia('(max-width:900px)').matches)return;
    document.documentElement.style.setProperty('--toast-h',(Math.ceil(el.getBoundingClientRect().height)+12)+'px');
    requestAnimationFrame(()=>{
      if(!el.isConnected)return;
      const tr=el.getBoundingClientRect();
      const pay=document.querySelector('#payw');
      const pr=pay&&!pay.hidden?pay.getBoundingClientRect():null;
      const top=Math.min(tr.top,pr&&pr.height?pr.top:tr.top);
      const bottom=Math.max(tr.bottom,pr&&pr.height?pr.bottom:tr.bottom);
      let dy=0;
      for(const b of document.querySelectorAll('#tbody .btn')){
        const r=b.getBoundingClientRect();
        if(r.width<1||r.bottom<=top+1||r.top>=bottom-1||r.right<=0||r.left>=innerWidth)continue;
        dy=Math.max(dy,Math.ceil(r.bottom-top)+8);
      }
      if(dy)document.querySelector('.wrap').scrollBy(0,dy);
    });
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='speed'){setSpeed(+b.dataset.v);return;}
  if(act==='skip'){fastForward(TICKS_PER_DAY,0);return;}
  if(act==='closedigest'){if(ff)return;$('digest').hidden=true;maybeEnding();return;}
  if(act==='closeending'){$('ending').hidden=true;if(S.conquered)S.conquered.ending=false;save();return;}
  if(act==='adv'){advOpen=+b.dataset.a;$('advm').hidden=false;$('advbox').scrollTop=0;renderAdv();return;}
  if(act==='closeadv'){if(b.id==='advm'&&e.target!==b)return;advOpen=null;$('advm').hidden=true;return;}
  if(act==='memo'){reviveNote=null;tab='desk';$('tbody').scrollTop=0;render();focusSide();const memo=$('memo');if(memo&&!matchMedia('(max-width:900px)').matches)memo.scrollIntoView({block:'nearest',behavior:'instant'});return;}
  if(act==='tab'){if(b.dataset.v!=='desk')reviveNote=null;tab=b.dataset.v;$('tbody').scrollTop=0;renderSide();focusSide();return;}
  if(act==='shoptier'){shopTier=+b.dataset.v;renderSide();return;}
  if(act==='selc'){S.sel=+b.dataset.i;render();return;}
  if(act==='watch'){
    const p=S.parties[b.dataset.p];
    if(!visible(p)){toast(p.state==='wiped'?(p.tav==='rival'?'銀の杯亭の全滅は、噂でしか伝わらない':p.announced?'消息不明の一行は、水晶には映らない':'水晶は闇しか映さない'):(p.tav==='rival'?'銀の杯亭の一行は、すれ違ったときしか見えない':'水晶は闇しか映さない'));return;}
    const j=S.watch.indexOf(p.id);if(j>=0){S.sel=j;render();return;}
    S.watch[S.sel]=p.id;render();return;
  }
  if(act==='recall'){const p=S.parties[b.dataset.p];
    // 伏せ中の一行にも、生きている一行と同じく伝書鳩を飛ばせる。届いても、誰も戻らない
    if(hideRecall(p)&&T().gold>=50){T().gold-=50;p.hideRecall=S.tick;render();save();return;}
    if(p&&p.state==='explore'&&T().gold>=50){T().gold-=50;plog(p,'でんしょばとが まいおりた。「すぐ もどれ」','sys');p.state='return';say(S,p,['……店主の めいれいだ。もどるぞ']);render();save();}return;}
  if(act==='reset'){if(confirm('いまの記録を消して、最初から始めますか？\n消した記録は戻りません。')){reviveNote=null;S=newState();for(let i=0;i<6;i++)tick(S);save();autoWatch();render();toast('黒猫亭が店を開いた');}return;}
  if(act==='repay'){const x=repay(S,+b.dataset.v);if(x)toast(`両替商に${x}Gを返した`);render();save();return;}
  if(act==='seats'){const ns=nextSeats(S);if(ns&&T().gold>=ns[2]){T().gold-=ns[2];T().seats=ns[1];news(S,`黒猫亭が店を広げた。常連の席は${ns[1]}席になった。`,'record');toast(`常連の席は${ns[1]}席になった`);}render();save();return;}
  if(act==='pol'){const k=b.dataset.k,v=+b.dataset.v;policy(S)[k]=k==='potion'?v:!!v;renderSide();save();return;}
  if(act==='gift'){const a=S.adv[b.dataset.a];const o=a&&giftOffer(S,a);const it=o&&giveGift(S,a,o,'店主から');if(it){toast(`${a.name}に${it.n}を贈った`);news(S,`黒猫亭の店主が${a.name}に${it.n}を贈った。`,'info');}render();save();return;}
  if(act==='donate'){if(donate(S))toast('灰の寺院に寄進した');render();save();return;}
  if(act==='fac'){{const t=nextFac(S,b.dataset.k);if(buildFac(S,b.dataset.k))toast(`${t[0]}を建てた`);};render();save();return;}
  if(act==='poach'){const a=S.adv[b.dataset.a];if(a&&poach(S,a))toast(`${a.name}を黒猫亭に迎え入れた`);render();save();return;}
  if(act==='custom'){const a=S.adv[b.dataset.a];const it=a&&orderCustom(S,a,customOffer(S,a));if(it)toast(`${a.name}に${it.n}が届いた`);render();save();return;}
  if(act==='invest'||act==='buysmall'){const t=smallOf(S).find(x=>x.n===b.dataset.n);if(t&&(act==='invest'?invest(S,t):buySmall(S,t)))toast(act==='invest'?`${t.n}に出資した`:`${t.n}を買い取った`);render();save();return;}
  if(act==='revive'){const a=S.adv[b.dataset.a];const c=a&&templeCost(S,a);if(a&&(a.status==='dead'||a.status==='ash')&&T().gold>=c){T().gold-=c;flowAdd(S,'v',c);owe(S,a.party&&S.parties[a.party],c);const r=temple(S,a,true);const t=reviveResultText(a.name,r);reviveNote=t?{id:a.id,t,kind:r,status:a.status}:null;if(t)toast(t);render();save();}return;}
  if(act==='pickerr'){pickErr=b.dataset.e?+b.dataset.e:null;renderSide();return;}
  if(act==='boardhelp'){boardHelpOpen=!boardHelpOpen;renderSide();return;}
  if(act==='assign'){const e=errandsOf(S).board.find(x=>x.id===+b.dataset.e),a=S.adv[b.dataset.a];const r=e&&a&&assignErrand(S,e,a);
    if(r==='ok'){pickErr=null;toast(`「${e.n}」を${a.name}に回した`);}else if(r==='pending'){pickErr=null;toast(`「${e.n}」は、次に酒場で会えたら${a.name}に伝える`);}else if(r==='refused')toast(`${a.name}は「${e.n}」を断った`);render();save();return;}
  if(act==='unpend'){const e=errandsOf(S).board.find(x=>x.id===+b.dataset.e);if(e&&e.pend){e.pend=null;toast(`「${e.n}」の主役の指定を取り消した`);}render();save();return;}
  if(act==='mark'){const a=S.adv[b.dataset.a];if(a&&markAdv(S,a,!a.marked))toast(a.marked?`${a.name}を見込んだ`:`${a.name}の見込みを外した`);render();save();return;}
  if(act==='bounty'){const p=S.parties[b.dataset.p];if(!p||S.bounties[p.id])return;const c=bountyPrice(p);if(T().gold<c){toast('お金が足りない');return;}T().gold-=c;S.bounties[p.id]=c;toast(`掲示板に依頼を貼り出した（${c}Gを預けた）`);render();save();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&advOpen!=null){advOpen=null;$('advm').hidden=true;return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.c-head')){e.preventDefault();e.target.click();}});
// 開いたまま裏に回ったタブは、ブラウザがタイマーを止めたり間引いたりする。戻ったときに、裏にいた時間を進める
// 裏に回ったときに一度保存する。そのあとページが捨てられて pagehide が来ても、保存し直すと時刻が閉じた瞬間まで進み、裏にいた時間が消える
function onHide(){if(hiddenAt!=null)return;hiddenAt=Date.now();clearInterval(timer);save();}
function onShow(){
  if(hiddenAt==null)return;
  const away=Math.floor((Date.now()-hiddenAt)/1000);hiddenAt=null;
  const {n,digest}=speed>0?awayPlan(away):{n:0};
  if(n>0){
    if(ff)ff.n+=n;
    else if(digest)fastForward(n,away);
    else{for(let i=0;i<n;i++){tick(S);rivalTemple(S);}autoWatch();render();save();}
  }
  setSpeed(speed);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')onHide();else onShow();});
window.addEventListener('resize',placeTabs);
window.addEventListener('pagehide',onHide);
window.addEventListener('pageshow',e=>{if(e.persisted)onShow();});
boot();
if(document.visibilityState==='hidden')onHide();
