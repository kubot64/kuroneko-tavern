<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒場・黒猫亭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
/* Layout: tavern counter (top bar) / crystals + parties on the left, ledger tabs on the right. One deliberate night-time look. */
:root{
  --bg:#17120e; --panel:#211a14; --panel2:#2a2119; --line:#3d3025;
  --fg:#ecdfc7; --muted:#a8957a; --amber:#e3a649; --amber-dim:#8a6430;
  --crystal:#0a0e1d; --crystal-fg:#d7e2ff; --crystal-dim:#7d8bb5; --glow:#5d7dff;
  --blood:#e2604f; --heal:#72cf8f; --ash:#8f8a84; --rival:#9fb4d8;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-log:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:10px;border-bottom:1px solid var(--line)}
.sign{display:flex;align-items:center;gap:10px}
.sign svg{width:34px;height:34px;flex:none}
.sign h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.08em;line-height:1}
.sign small{display:block;color:var(--muted);font-size:11px;letter-spacing:.2em}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stats b{color:var(--fg);font-size:16px;margin-inline:2px}
.stats .gold b{color:var(--amber)}
.ctrl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px}
.btn:hover{border-color:var(--amber-dim)}
.btn.on{background:var(--amber);color:#1b1309;border-color:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12px}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.h2{font-family:var(--f-display);font-size:15px;letter-spacing:.12em;margin:0 0 8px;color:var(--amber);display:flex;align-items:baseline;gap:10px}
.h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0}

/* crystals */
.crystals{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.crystal{background:radial-gradient(120% 90% at 50% 0%,#141c3a 0%,var(--crystal) 60%);border:1px solid #26305a;border-radius:14px;box-shadow:0 0 0 1px #0004 inset,0 0 24px -8px var(--glow);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.crystal.sel{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow) inset,0 0 30px -6px var(--glow)}
.c-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #1d2546;cursor:pointer}
.c-head .orb{width:10px;height:10px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);flex:none}
.c-head .nm{font-family:var(--f-display);color:var(--crystal-fg);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-head .fl{margin-left:auto;font-family:var(--f-log);color:var(--crystal-dim);font-size:13px;white-space:nowrap}
.c-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px;padding:8px 12px;font-family:var(--f-log);font-size:12px;color:var(--crystal-fg);border-bottom:1px solid #1d2546;font-variant-numeric:tabular-nums}
.c-members .m{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.c-members .m.low{color:var(--amber)}
.c-members .m.dead{color:var(--blood)}
.c-log{font-family:var(--f-log);font-size:13px;line-height:1.55;color:var(--crystal-fg);padding:10px 12px;height:380px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.c-log .sys{color:#fff;text-align:center}
.c-log .say{color:#ffe2a8}
.c-log .death{color:var(--blood)}
.c-log .loot{color:#9fe0b2}
.c-log .move{color:var(--crystal-dim)}
.c-log .lvl{color:#c8b6ff}
.c-log .nw{animation:lineIn .18s ease-out both}
@keyframes lineIn{from{opacity:0;transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.c-log .nw{animation:none}}
.c-empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--crystal-dim);font-family:var(--f-log);height:100%;min-height:200px;padding:20px}
.c-foot{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #1d2546;font-size:12px;color:var(--crystal-dim)}
.c-foot .btn{background:#151c36;border-color:#2a3666;color:var(--crystal-fg)}
.c-foot .btn:hover{border-color:var(--glow)}

/* party strip */
.parties{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.pcard:hover{border-color:var(--amber-dim)}
.pcard.watching{border-color:var(--glow)}
.pcard.rival{background:#1b1a1c}
.pcard .top{display:flex;align-items:baseline;gap:6px;min-width:0}
.pcard .pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.tag.ours{color:var(--amber);border-color:var(--amber-dim)}
.tag.rival{color:var(--rival);border-color:#3c4a66}
.pcard .st{font-size:12px;color:var(--muted)}
.pcard .st.bad{color:var(--blood)}
.hpstrip{display:flex;gap:3px}
.hpstrip i{flex:1;height:5px;border-radius:2px;background:#0003;position:relative;overflow:hidden}
.hpstrip i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c)}

/* side ledger */
.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 24px)}
@media (max-width:900px){.side{position:static;max-height:none}}
.tabs{display:flex;flex-direction:column;flex:none;border-bottom:1px solid var(--line)}
.tabrow{display:flex;align-items:center;overflow-x:auto}
.tabrow+.tabrow{border-top:1px dashed var(--line)}
.tabs .tg{font-size:10px;color:var(--muted);padding:0 4px 0 10px;letter-spacing:.1em;flex:none;opacity:.8}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--amber)}
.tabs .cnt{font-size:10px;color:var(--amber);margin-left:3px}
.tbody{padding:12px 14px;overflow-y:auto;flex:1;min-height:300px}
@media (max-width:900px){.tbody{max-height:520px}}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.news li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.5}
.news .d{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;padding-top:2px}
.news .death{color:var(--blood)}
.news .lost{color:var(--ash)}
.news .record{color:var(--amber)}
.news .loot{color:var(--heal)}
.news .rumor{color:var(--rival)}
.news .lore{color:#c8b6ff}
.news .edict{color:var(--fg);font-weight:700}
.quote.edict{border-left:3px solid var(--amber)}
.note{color:var(--muted);font-size:12px;margin:0 0 10px}
.sect{margin-bottom:16px}
.sect h3{font-size:12px;color:var(--muted);letter-spacing:.15em;margin:0 0 6px;font-weight:400}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.row .who{min-width:0;flex:1}
.row .who b{font-weight:700}
.row .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ttl{color:var(--amber);font-size:12px}
.chip{font-size:11px;padding:0 6px;border-radius:3px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.dead{color:var(--blood)} .chip.ash{color:var(--ash)} .chip.party{color:var(--glow)} .chip.missing{color:var(--blood)}
.quote{font-size:13px;padding:8px 10px;background:var(--panel2);border-radius:4px;margin-bottom:8px}
.quote.chat div{line-height:1.7}
.quote.chat .nm-link{font-weight:700}
.quote .by{color:var(--muted);font-size:11px;display:block}
.stone{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:linear-gradient(#26201a,#1c1712)}
.stone b{font-family:var(--f-display)}
.stone .ep{color:var(--muted);font-size:12px}

/* modal */
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--panel);border:1px solid var(--amber-dim);border-radius:8px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
.mbox h2{font-family:var(--f-display);margin:0 0 4px;font-size:22px;letter-spacing:.1em}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sum div{background:var(--panel2);border-radius:4px;padding:8px;text-align:center}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:11px;color:var(--muted)}
@media (max-width:420px){.sum{grid-template-columns:repeat(2,1fr)}}
.mbox.wide{max-width:640px}
.nm-link{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--amber-dim);text-underline-offset:3px;cursor:pointer}
.nm-link:hover{color:var(--amber)}
.c-members .nm-link{font-weight:400;text-decoration-color:#3a4677}
.c-members .nm-link:hover{color:#fff}
.adv-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.adv-h h2{margin:0}
.adv-sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.dream{border-left:3px solid var(--amber);padding:6px 10px;background:var(--panel2);margin:10px 0;font-size:13px}
.dream.done{border-left-color:var(--heal)}
.dream.odd{border-left-color:var(--rival)}
.dream.cls{border-left-color:var(--glow)}
.clsmark{color:var(--glow);font-size:11px;margin-left:4px}
.cl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 8px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cl b{font-size:13px}
.cl span{color:var(--muted)}
.eqtab{display:flex;flex-direction:column;margin:10px 0;border-top:1px solid var(--line)}
.eqtab>div{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.eqtab .sl{color:var(--muted);font-size:12px}
.eqtab .st{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}
.eqtab .rare{color:var(--amber)}
.eqtab .none{color:var(--muted)}
.mat{display:grid;grid-template-columns:76px minmax(0,1fr) 64px;gap:2px 8px;align-items:center;font-size:12.5px;padding:4px 0}
.mat .bar{align-self:center;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.mat .bar i{display:block;height:100%;background:var(--amber)}
.mat>span:last-child{grid-column:2 / -1;font-size:11px}
.tiers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tblwrap{overflow-x:auto}
.maptbl{width:100%;border-collapse:collapse;font-size:12px}
.maptbl th{text-align:left;font-weight:400;color:var(--muted);font-size:11px;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.maptbl td{padding:4px 6px 4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.maptbl td.fl{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg)}
.maptbl tr.zone td{color:var(--amber);font-size:11px;letter-spacing:.1em;padding-top:10px;border-bottom:0}
.maptbl .mok{color:var(--heal);white-space:nowrap}
.maptbl .mwip{color:var(--amber);white-space:nowrap}
.shoptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.shoptbl td{padding:4px 6px 4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.shoptbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--amber)}
.eqtab .lore{grid-column:2 / -1;color:var(--muted);font-size:11.5px;margin-top:-2px}
@media (max-width:480px){.eqtab>div{grid-template-columns:92px minmax(0,1fr)}.eqtab .st{grid-column:2;text-align:left}}
.oddmark{color:var(--rival);font-size:11px;margin-left:4px}
.ptag{font-size:11px;margin-left:4px;padding:0 5px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap}
.ptag.lead{color:var(--amber);border-color:var(--amber-dim)}
.ptag.none{border-style:dashed}
.c-members .lead{color:var(--amber);margin-right:2px}
.dream small{display:block;color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:10px 0}
.kv div{background:var(--panel2);border-radius:4px;padding:6px 8px;font-size:12px;color:var(--muted)}
.kv b{display:block;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:8px 0 0;padding:0;border-left:1px solid var(--line)}
.tl li{position:relative;padding:3px 0 7px 14px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-4px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--amber-dim)}
.tl .d{color:var(--muted);font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums}
.does{display:block;color:var(--muted);font-size:12px}
.seats{display:flex;gap:3px;margin:2px 0 10px}
.seats i{width:14px;height:14px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.seats i.on{background:var(--amber-dim);border-color:var(--amber-dim)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amber);color:#1b1309;padding:6px 14px;border-radius:4px;font-size:13px;z-index:11}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>


</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="sign">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#2a2119" stroke="#8a6430"/><path d="M11 30 L11 15 L15 19 Q20 17 25 19 L29 15 L29 30 Q20 34 11 30Z" fill="#0d0a08"/><circle cx="16.5" cy="23" r="1.6" fill="#e3a649"/><circle cx="23.5" cy="23" r="1.6" fill="#e3a649"/></svg>
      <div><h1 id="tname">黒猫亭</h1><small>迷宮のほとりの酒場</small></div>
    </div>
    <div class="stats">
      <span>迷宮暦<b id="year">81</b>年<b id="md">1月1日</b><b id="hr">0時</b>・解禁から<b id="day">1</b>日目</span>
      <span class="gold">所持金<b id="gold">0</b>G</span>
      <span id="debtw">借金<b id="debt">0</b>G</span>
      <span>評判<b id="rep">0</b></span>
      <span>最深到達<b id="deep">B1F</b></span>
    </div>
    <div class="ctrl">
      <button class="btn" data-act="speed" data-v="0" id="sp0">止める</button>
      <button class="btn on" data-act="speed" data-v="1" id="sp1">ふつう</button>
      <button class="btn" data-act="speed" data-v="4" id="sp4">はやい</button>
      <button class="btn" data-act="skip">1日放置する</button>
    </div>
  </header>

  <div class="grid">
    <div class="left">
      <section>
        <h2 class="h2">遠見の水晶 <span>覗きたい一行を下から選ぶと、水晶に映ります</span></h2>
        <div class="crystals" id="crystals"></div>
      </section>
      <section>
        <h2 class="h2">迷宮に潜る一行 <span>銀の杯亭の一行は、こちらとすれ違ったときだけ水晶に映ります</span></h2>
        <div class="parties" id="parties"></div>
      </section>
    </div>
    <aside class="side">
      <nav class="tabs" id="tabs"></nav>
      <div class="tbody" id="tbody"></div>
    </aside>
  </div>
</div>

<div class="modal" id="advm" hidden data-act="closeadv">
  <div class="mbox wide" role="dialog" aria-label="冒険者の手帳" id="advbox"></div>
</div>
<div class="modal" id="digest" hidden>
  <div class="mbox" role="dialog" aria-labelledby="dg-t">
    <h2 id="dg-t">留守のあいだに</h2>
    <div class="note" id="dg-sub"></div>
    <div class="sum" id="dg-sum"></div>
    <ul class="news" id="dg-news"></ul>
    <div style="margin-top:16px;text-align:right"><button class="btn on" data-act="closedigest">店に戻る</button></div>
  </div>
</div>

<script>
/*ENGINE START*/
const R=()=>Math.random();
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const chance=p=>R()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

}

function tick(S){
  S.tick++;edictTick(S);mapTick(S);chatterTick(S);debtTick(S);rivalTick(S);
  for(const p of Object.values(S.parties)) stepParty(S,p);
  for(const tav of ['ours','rival']){
    if(chance(.12)) formParties(S,tav);
    const rate=(tav==='ours'?0.016+Math.min(S.taverns.ours.rep,200)*0.00008:0.018)*(edict(S,'mercs')?1.8:1);
    if(seatsUsed(S,tav)<seatCap(S,tav)&&chance(rate)){const a=makeAdv(S,tav,edict(S,'mercs')&&chance(.5)?{origin:'グラウ帝国',race:'人間'}:{}); if(tav==='ours'&&policy(S).rookie&&a.lvl<10){for(let k=0;k<2;k++){const o=giftOffer(S,a);if(!o||o.price>incomeAt(depthOf(a)+2)*3)break;giveGift(S,a,o,'店主から支度の品として');}}
      if(tav==='ours') news(S,`新顔がやってきた。${ORIGINS[a.origin].far?'海の向こう、'+a.origin+'から来た':a.origin+'出身の'}${a.bg}だという${a.race==='人間'?a.age+'歳の':'人間でいえば'+humanAge(a)+'歳ほどの'}${a.sex==='女'?'女':''}${a.race}の${a.cls}、${a.name}（レベル${a.lvl}）。${a.odd?a.race+'の'+a.cls+'とは珍しい。':''}${CLS[a.cls].rare?a.cls+'とは、めったに見ない職業だ。':''}${a.blessed?'生まれながらに'+a.traits.join('・')+'を備えた、天に愛された者らしい。':''}${a.cursed?'見るからに星回りが悪い。'+a.traits.join('・')+'と、不得手ばかりだという。':''}`,a.odd||CLS[a.cls].rare||ORIGINS[a.origin].far||a.blessed||a.cursed?'record':'info');
      else if(a.odd||CLS[a.cls].rare) news(S,`噂：銀の杯亭に${a.race}の${a.cls}が現れたらしい。`,'rumor');}
  }
  if(S.tick%(TICKS_PER_DAY*365)===0){
    Object.values(S.adv).forEach(a=>{if(a.status!=='lost'&&a.status!=='retired'&&a.age)a.age++;});
    news(S,`迷宮暦${81+Math.floor(S.tick/TICKS_PER_DAY/365)}年が明けた。冒険者たちはひとつ歳をとる。`,'info');
  }
  // temple on credit after a long wait (ours)
  for(const a of Object.values(S.adv)){
    if(a.tav!=='ours'||(a.status!=='dead'&&a.status!=='ash'))continue;
    a.tw=(a.tw||0)+1;
    if(policy(S).revive&&S.taverns.ours.gold>=templeCost(S,a)){const c0=templeCost(S,a);S.taverns.ours.gold-=c0;S.taverns.ours.support=(S.taverns.ours.support||0)+c0;favor(a,1);chron(S,a,`店主が蘇生代${c0}Gを出してくれる`);temple(S,a,true);continue;}
    if(a.tw>120){a.tw=0;const cost=templeCost(S,a);a.gold-=cost;chron(S,a,`寺院に${cost}Gの借りを作って蘇生を受ける`);temple(S,a,true);}
  }
  // the dungeon swallows parties nobody recovers
  for(const p of Object.values(S.parties)){
    if(p.state==='wiped'&&S.tick-p.wipedAt>1000){
      p.members.forEach(id=>{const a=A(S,id);if(a.status!=='missing')return;a.status='lost';a.party=null;chron(S,a,`B${p.floor}Fから戻ることなく、迷宮に呑まれる`);
        S.memorial.push({id:a.id,name:full(a),cls:a.cls,lvl:a.lvl,race:a.race,tav:a.tav,tk:S.tick,by:a.lastBy||p.killer||'不明',floor:p.floor,kills:a.kills});onLostFriend(S,a);});

      delete S.bounties[p.id];delete S.parties[p.id];

  for(const p of Object.values(S.parties)){
    if(p.state==='wiped'&&!p.announced&&S.tick-p.wipedAt>=(p.tav==='ours'?15:25)){
      p.announced=true;

      if(p.tav==='ours') news(S,`${p.name}が予定を過ぎても戻らない。${p.pushWhy?WHY[p.pushWhy]+'という。':''}最後に向かったのはB${p.floor}Fだという。`,'death');
      else news(S,`噂：銀の杯亭の${p.name}が、B${p.floor}Fから戻らないらしい。${p.pushWhy==='race'?'黒猫亭に負けまいと焦ったのだろう、と皆が言う。':p.pushWhy==='bounty'?'報奨金に目がくらんだのだろう。':''}`,'rumor');
    }

function stepParty(S,p){
  if(p.state==='wiped') return;
  if(p.state==='town'){
    p.rest--; if(p.rest>0) return;
    let roster=Object.values(S.adv).filter(a=>a.party===p.id&&a.status!=='lost'&&a.status!=='retired'&&a.status!=='missing');
    roster.filter(a=>a.tav!==p.tav).forEach(a=>{a.party=null;});roster=roster.filter(a=>a.tav===p.tav);
    let L=A(S,p.leader);
    if(!p.leader&&roster.length){p.leader=roster.slice().sort((x,y)=>leaderScore(y)-leaderScore(x))[0].id;L=A(S,p.leader);}
    if(!L||L.party!==p.id||L.status==='lost'||L.status==='retired'||L.tav!==p.tav){if(!succession(S,p,roster.filter(a=>a!==L),L))return;L=A(S,p.leader);roster=roster.filter(a=>a.party===p.id);}
    p.size=6;
    if(roster.length>6){roster.sort((x,y)=>y.lvl-x.lvl);roster.slice(6).forEach(a=>{if(a===L)return;a.party=null;chron(S,a,`人数が多すぎて${p.name}を離れる`);});roster=roster.filter(a=>a.party===p.id);}
    if(roster.length<p.size){const extra=freeAdv(S,p.tav).filter(a=>a.party!==p.id&&Math.abs(PL(a)-PL(L))<=6).sort((x,y)=>{const bx=bondOf(S,L,x),by=bondOf(S,L,y);return ((by?by.n:0)-(bx?bx.n:0))||(Math.abs(PL(x)-PL(L))-Math.abs(PL(y)-PL(L)));});
      while(roster.length<p.size&&extra.length){const a=extra.shift();a.party=p.id;roster.push(a);plog(p,`${a.name} が なかまに くわわった`,'sys');chron(S,a,`${L.name}に誘われ、${p.name}に加わる`);if(p.tav==='ours')news(S,`${L.name}が、${a.name}を${p.name}に迎え入れた。`,'info');}}
    let ms=roster.filter(a=>a.status==='idle');
    const allIn=ms.length===roster.length;
    if(ms.length>=3&&(allIn||(p.wait||0)>150)&&(ms.includes(L)||(p.wait||0)>300)){
      p.wait=0;
      p.members=ms.map(a=>a.id); ms.forEach(a=>{a.status='party'});
      Object.assign(p,{floor:1,state:'explore',steps:0,fsteps:0,loot:0,carried:[],trip:newTrip(),rescue:[],tmap:{},guard:0});
      plog(p,'――――――――――','move'); plog(p,`${p.name} が ふたたび めいきゅうへ`,'sys');supplyTeam(S,p);setPlan(S,p);
      const lim=Math.min(p.reach||0,Math.floor(safeFloor(S,p)),p.cap||99);const st=STONES.filter(x=>x<=lim).pop();
      if(st){p.floor=st;p.trip.deep=st;plog(p,`てんいの せきひで B${st}F へ（${zoneOf(st)}）`,'sys');}
      floorArrive(S,p);
    } else {
      p.wait=(p.wait||0)+1;
      if(p.wait>450&&ms.length<3){disbandParty(S,p,'仲間がそろわず');}
    }
    return;
  }
  // poison tick
  if(S.tick%2===0) for(const a of alive(S,p)) if(a.poison&&a.hp>1){a.hp-=1;}
  if(!alive(S,p).length){wipe(S,p,'どく');return;}
  if(p.enemies){combat(S,p);return;}
  p.steps++;
  if(p.state==='return'){
    if(p.floor>=6&&hpRatio(S,p)<.35){const c=alive(S,p).find(a=>CAN.dasshutsu(a)&&a.mp>=3);if(c){escape(S,p,c);return;}}
    if(chance(.18)){encounter(S,p);return;}
    findCorpses(S,p,.02);
    if(chance(.3)){
      if(STONES.includes(p.floor)){plog(p,`てんいの せきひに ふれた……ちじょうへ`,'sys');p.floor=0;arrive(S,p);return;}
      p.floor--;
      if(p.floor<=0){arrive(S,p);return;}
      plog(p,`かいだんを のぼった……B${p.floor}F`,'move');
    } else plog(p,pick(MOVE),'move');
    return;
  }
  // explore
  p.fsteps++;
  const pers=PERS[leader(S,p).pers]; const r=hpRatio(S,p);
  const al=alive(S,p);
  const casters=al.filter(a=>C(a).heal);
  const healLeft=casters.reduce((s,a)=>s+a.mp,0);
  const owe=p.tav==='rival'&&al.some(a=>(a.debt||0)>0);
  const th=pers.th+(avgLvl(S,p)<3?.12:0)-(owe?.06:0)-(p.pushWhy?.06:0);
  const lostOne=(al.length<p.members.length||al.some(a=>a.hp<a.mhp*.2))&&leader(S,p).pers!=='無謀';
  let goHome = r<th || lostOne || al.length<=Math.ceil(p.members.length/2) || p.steps>(p.plan==='grind'?220:160) || (healLeft===0&&r<th+.2&&casters.length>0);
  if(p.carried.length&&!goHome) goHome=true;
  if(goHome){
    p.state='return'; say(S,p,RET[leader(S,p).pers]); return;
  }
  if(r<.5&&PUSH[leader(S,p).pers]&&chance(.3)) say(S,p,PUSH[leader(S,p).pers]);
  if(chance(.07)){const q=pick(al);plog(p,pick(QUIRKS[q.quirk].d).replace('{n}',q.name),'say');}
  for(const a of al){const d=a.dream;if(d&&!d.done&&d.k==='kin'&&p.floor===d.f&&chance(.012)){kinEvent(S,p,a);return;}}

  const safe=safeFloor(S,p);
  if(p.fsteps>=(hasMap(p)?6:10)&&p.floor<MAXF&&p.floor<Math.min(p.cap||99,Math.max(safe+(owe?.7:0)+(p.plan==='push'?(p.pushWhy?1:.5):0),p.plan==='push'&&p.pushTo?p.pushTo:0))&&r>pers.th-(owe?.06:0)+.25&&chance(.3)){
    if(p.floor===DRAGON_F&&dragonAlive(S)){say(S,p,DESC[leader(S,p).pers]);dragonEncounter(S,p);return;}
    say(S,p,DESC[leader(S,p).pers]);
    p.floor++;p.fsteps=0;p.trip.deep=Math.max(p.trip.deep,p.floor);
    floorThrough(S,p,p.floor-1);
    plog(p,`かいだんを おりた……B${p.floor}F`,'sys');p.reach=Math.max(p.reach||0,p.floor);
    floorArrive(S,p);if(isFrontier(S,p.floor))plog(p,'だれも しらない かいだ。くうきが ちがう','death');else if(!hasMap(p))plog(p,'ちずの ない かいだ。しんちょうに すすめ','move');
    if(ZONES.some(z=>z[0]===p.floor))plog(p,`――ここから先は ${zoneOf(p.floor)}――`,'sys');

const TITLE_TIER={k80:1,disarm:1,rev2:1,deep:2,rare:2,rev3:2,k300:3,dragon:3,item:3,conq:4};
function title(S,a,quiet){
  const ach=[];
  if(a.kills>=80)ach.push('k80');if(a.disarms>=8)ach.push('disarm');if((a.rareKills||0)>=1)ach.push('rare');if(a.deepest>=GATE_F+8)ach.push('deep');
  if(a.revived>=3)ach.push('rev2');if(a.kills>=500)ach.push('k300');if((a.slain||{})['黒竜'])ach.push('dragon');if(a.revived>=5)ach.push('rev3');
  if(eqList(a).some(it=>it.rare))ach.push('item');if(a.conq)ach.push('conq');
  if(!ach.length)return;
  const top=Math.max(...ach.map(k=>TITLE_TIER[k]));if(a.titleKind&&(TITLE_TIER[a.titleKind]||0)>=top)return;
  const others=Object.values(S.adv).filter(b=>b!==a&&b.title&&b.status!=='lost'&&b.status!=='retired');
  const taken=new Set(others.map(b=>b.title)),stems=new Set(others.map(b=>b.titleStem).filter(Boolean));
  const kinds=ach.filter(k=>TITLE_TIER[k]===top).sort(()=>R()-.5).concat(ach.filter(k=>TITLE_TIER[k]===top-1).sort(()=>R()-.5));
  let t=null,st=null,kind=null;
  for(const k of kinds){const c=titleCands(S,a,k).filter(c=>c&&c[1]).sort(()=>R()-.5).find(c=>!stems.has(c[0])&&!taken.has(c[1]));if(c){t=c[1];st=c[0];kind=k;break;}}
  if(!t){const adj=(a.traits||[]).map(x=>TITLE_ADJ[x]).filter(Boolean).concat([ORIGINS[a.origin]?ORIGINS[a.origin].short+'の':'']);kind=kinds[0];
    for(const c of titleCands(S,a,kind).sort(()=>R()-.5)){for(const ad of adj){if(ad&&!taken.has(ad+c[1])){t=ad+c[1];st=c[0]+'+'+ad;break;}}if(t)break;}}
  if(!t||(a.titleKind===kind&&a.title))return;
  a.titleStem=st;a.title=t;a.titleKind=kind;a.titleTier=TITLE_TIER[kind];if(quiet)return;chron(S,a,`「${t}」と呼ばれはじめる`);news(S,`${S.taverns[a.tav].name}の${a.name}が「${t}」と呼ばれはじめた。`,'record');
}

function debtNews(S){const T0=S.taverns.ours;if(T0.debt<=0&&!T0.debtFree){T0.debt=0;T0.debtFree=S.tick;T0.rep+=10;news(S,'黒猫亭の借金を、すべて返し終えた。店はようやく、本当に店主のものになった。','record');}}
function repay(S,amt){const T0=S.taverns.ours;const x=Math.min(amt,T0.debt,Math.max(0,T0.gold));if(x<=0)return 0;T0.gold-=x;T0.debt-=x;T0.repaid=(T0.repaid||0)+x;debtNews(S);return x;}
function debtTick(S){const T0=S.taverns.ours;if(!(T0.debt>0))return;if(T0.nextPay==null)T0.nextPay=S.tick+30*TICKS_PER_DAY;if(S.tick<T0.nextPay)return;
  T0.nextPay=S.tick+30*TICKS_PER_DAY;const intr=Math.round(T0.debt*.02);T0.debt+=intr;const due=Math.min(T0.debt,DEBT_DUE+intr);
  if(T0.gold>=due){T0.gold-=due;T0.debt-=due;T0.repaid=(T0.repaid||0)+due;T0.late=0;news(S,`セーレの両替商に、今月の返済${due}G（うち利息${intr}G）を払った。借金の残りは${T0.debt}G。`,'info');}
  else{const p0=Math.max(0,T0.gold);T0.gold-=p0;T0.debt-=p0;const pen=Math.round((due-p0)*.25);T0.debt+=pen;T0.late=(T0.late||0)+1;T0.rep=Math.max(0,T0.rep-3);
    news(S,`今月の返済に${due-p0}G足りなかった。両替商の取り立て人が店先に居座り、客が眉をひそめている。延滞の罰金${pen}Gが上乗せされ、借金の残りは${T0.debt}G。`,'death');}
  debtNews(S);}
function moveTav(S,a,tav){const team=a.party&&S.parties[a.party];if(team&&team.state!=='town')return false;
  a.party=null;const from=S.taverns[a.tav].name;a.tav=tav;a.favor=0;chron(S,a,`${from}を出て、${S.taverns[tav].name}の客になる`);return true;}
function pickAce(S,quiet){const ps=Object.values(S.parties).filter(p=>p.tav==='rival'&&p.state!=='wiped');if(!ps.length)return;
  ps.sort((x,y)=>avgLvl(S,y)-avgLvl(S,x));const b=ps[0];if(S.ace===b.id)return;Object.values(S.parties).forEach(p=>{p.ace=false;});S.ace=b.id;b.ace=true;
  if(!quiet)news(S,`噂：銀の杯亭の看板は、${b.name}に代わったらしい。`,'rumor');}
function rivalryNews(S,p){const RO=S.taverns.rival.owner||RIVAL_OWNER;
  if(p.tav==='rival'&&S.deepest.ours<p.floor-1&&chance(.5))news(S,`銀の杯亭の${RO}「黒猫亭さんの客は、まだB${S.deepest.ours}Fあたりですか。若い店主さんには、荷が重いでしょう」`,'rumor');
  else if(p.tav==='ours'&&S.deepest.rival<p.floor&&chance(.6))news(S,`噂：黒猫亭の${p.name}の名を聞いて、銀の杯亭の${RO}が舌打ちしたらしい。`,'rumor');}
function smallEvent(S){S.small=S.small||SMALL_TAV.slice(0,5);if(!S.small.length)S.small.push(pick(SMALL_TAV));const t=pick(S.small);
  const deep=Math.max(3,Math.min(S.deepest.ours,S.deepest.rival));const f=ri(Math.max(1,deep-4),Math.max(1,deep-1));const k=R();
  if(k<.3)news(S,`噂：${t}の一行が、B${f}Fで全滅したらしい。`,'rumor');

    if(seatsUsed(S,'ours')<seatCap(S,'ours')&&chance(.3+Math.min(.4,S.taverns.ours.rep*.003))){const a=makeAdv(S,'ours',{lvl:ri(3,10),bg:`店をたたんだ${t}の元常連`});news(S,`店をたたんだ${t}から、${a.name}（${a.race}の${a.cls}・レベル${a.lvl}）が黒猫亭に流れてきた。`,'record');}}
  else if(k<.8&&S.small.length<6){const nt=pick(SMALL_TAV.filter(x=>!S.small.includes(x)));if(nt){S.small.push(nt);news(S,`裏通りに、新しい酒場「${nt}」が開いた。`,'info');}}
  else news(S,`噂：${t}の客と銀の杯亭の客が、店の前で殴り合いになったらしい。`,'rumor');}
function rivalTick(S){
  if(S.nextSmall==null)S.nextSmall=S.tick+ri(4,8)*TICKS_PER_DAY;
  if(S.tick>=S.nextSmall){S.nextSmall=S.tick+ri(6,12)*TICKS_PER_DAY;smallEvent(S);}

  if(d%12===0&&seatsUsed(S,'ours')<seatCap(S,'ours')&&chance(.15+.25*Math.min(1.4,To.rep/Math.max(1,Tr.rep)))){
    const c=pick(Object.values(S.adv).filter(a=>a.tav==='rival'&&a.status==='idle'&&(a.debt||0)>0&&a.party!==S.ace&&(!a.party||!S.parties[a.party]||S.parties[a.party].state==='town')));
    if(c&&moveTav(S,c,'ours')){news(S,`銀の杯亭の${c.name}（${c.race}の${c.cls}・レベル${c.lvl}）が、取り立てに嫌気がさして黒猫亭に移ってきた。借金${c.debt}Gは踏み倒したらしい。`,'record');c.debt=0;}}
  if(!To.overtook&&To.rep>Tr.rep){To.overtook=S.tick;news(S,`ロウエンでいちばんの酒場は、もう銀の杯亭ではない。黒猫亭だ、という声が街に出はじめた。`,'record');}
  if(d%40===0&&chance(.5))news(S,pick([`銀の杯亭の${RO}が、また装備の貸付の値を上げたらしい。`,`噂：銀の杯亭の看板「${S.parties[S.ace]?S.parties[S.ace].name:'白銀の牙'}」の連中は、全員が${RO}に借りがあるらしい。`,`銀の杯亭の${RO}が、黒猫亭の前をわざわざ通って帰っていった。`,`噂：銀の杯亭の地下には、冒険者の借用書が山と積まれているらしい。`]),'rumor');}

function rivalTemple(S){

    Object.values(S.parties).forEach(p=>{p.maps=p.maps||{};});S.v=13;}
  if(!(S.v>=14)){policy(S);S.v=14;}

  if(!(S.v>=17)){const T0=S.taverns.ours;// 依頼の金を出す時点で預ける形に変わった。古い記録の依頼は、払えるものだけ預け直す

function migrateV2(S){
  S.usedNames={};S.usedItems={};S.uniqFound={};
  const advs=Object.values(S.adv).sort((a,b)=>a.id-b.id);
  const seen={};
  advs.forEach(a=>{ if(seen[a.name]||/Ⅱ$/.test(a.name)) a.name=null; else seen[a.name]=1; });
  Object.keys(seen).forEach(n=>S.usedNames[n]=1);
  (S.memorial||[]).forEach(m=>{S.usedNames[m.name.replace(/^「.*?」/,'')]=1;});
  advs.forEach(a=>{ if(!a.name) a.name=uname(S); });
  advs.forEach(a=>{ if(!a.item)return;
    const old=a.item;
    if(old.rare&&!S.uniqFound[old.n]){S.uniqFound[old.n]=1;S.usedItems[old.n]=1;return;}
    a.item=makeItem(S,Math.max(1,(old.f||1)),a.cls);
  });
  const pseen={};
  Object.values(S.parties).forEach(p=>{ if(pseen[p.name]) p.name=p.name+'・二'; pseen[p.name]=1; });
  S.usedParty=Object.assign(S.usedParty||{},pseen);
  S.v=2;
}
function boot(){

    try{localStorage.setItem(KEY+'-old20',JSON.stringify(saved));}catch(e){}

    news(S,'（迷宮が三十階に広がったため、記録を新しく始めた。以前の記録は、別にしまってある）','info');save();
  } else if(saved&&saved.S){
    S=saved.S;
    migrate(S);
    const away=Math.floor((Date.now()-saved.at)/1000);
    const pend=saved.pend||0;
    const n=Math.min(Math.floor(away/TICK_SEC),TICKS_PER_DAY*10)+pend;
    if(n>=30||pend>0) fastForward(n,away);
  } else {
    S=newState();
    for(let i=0;i<6;i++)tick(S);
  }
  if(!ff)autoWatch();render();setSpeed(1);
}

function fastForward(n,awaySec){
  if(ff)return;
  const st=ff={n,i:0,awaySec,startTick:S.tick,g0:S.taverns.ours.gold,lost0:S.memorial.length,returns:0,wipes:0};
  const btn=document.querySelector('[data-act="closedigest"]');btn.disabled=true;btn.textContent='時が流れている…';
  $('digest').hidden=false;drawDigest(st);
  const per=Math.max(1,Math.ceil(n/60));
  const run=()=>{
    const end=Math.min(st.n,st.i+per);
    for(;st.i<end;st.i++){
      const before=Object.values(S.parties).map(p=>[p.id,p.state]);
      tick(S);rivalTemple(S);
      before.forEach(([id,st2])=>{const p=S.parties[id];if(!p)return;if(p.tav!=='ours')return;if(st2!=='town'&&p.state==='town')st.returns++;if(st2!=='wiped'&&p.state==='wiped')st.wipes++;});
    }
    drawDigest(st);
    if(st.i<st.n){setTimeout(run,40);return;}
    ff=null;btn.disabled=false;btn.textContent='店に戻る';autoWatch();render();save();
  };
  setTimeout(run,40);
}
function drawDigest(st){

  const gd=S.taverns.ours.gold-st.g0;
  $('dg-sum').innerHTML=[[st.returns,'帰還'],[st.wipes,'消息不明'],[S.memorial.length-st.lost0,'ロスト'],[(gd>=0?'+':'')+gd+'G','売上']].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');

}

function renderAdv(){
  if(advOpen==null)return;const a=S.adv[advOpen];if(!a)return;
  const box=$('advbox');const st=box.scrollTop;
  const status={idle:'酒場にいる',party:'探索中',missing:'行方不明',dead:'寺院で眠る（死）',ash:'寺院で眠る（灰）',lost:'ロスト',retired:'店を去った'}[a.status];
  const team=a.party&&S.parties[a.party]?S.parties[a.party].name:'なし';
  const d=a.dream;
  box.innerHTML=`<div class="adv-h"><h2>${a.title?`<span class="ttl">「${esc(a.title)}」</span>`:''}${esc(a.name)}</h2><span class="chip ${a.status}">${status}</span>${teamTag(a)}</div>
  <div class="adv-sub">${S.taverns[a.tav].name}の客・出身：${esc(originOf(a))}${a.origin&&ORIGINS[a.origin].far?'（大陸の外）':''}・${sexAge(a)}${a.race!=='人間'?'（実年齢'+a.age+'歳）':''}・レベル${a.lvl}（${rankOf(a.lvl)}） ${a.race}の${a.cls}・${a.pers}・${esc(a.quirk)}・素質「${a.tal}」<br>${esc(a.bg)}<br>口調：${esc(a.tone||'普通')}・口癖「${esc(a.catch||'')}」・好物：${esc(a.food||'')}${a.fear?'・怖いもの：'+esc(a.fear):''}</div>
  ${(a.traits||[]).length?`<div class="dream${a.blessed?' odd':''}"><small>${a.blessed?'天に愛された者・':a.cursed?'星回りの悪い者・':''}得意と不得意</small>${trGood(a).map(t=>`<b>${t}</b>　${esc(TRAITS[t].d)}`).join('<br>')}${trGood(a).length&&trBad(a).length?'<br>':''}${trBad(a).map(t=>`<span style="opacity:.75">${t}</span>　${esc(TRAITS[t].d)}`).join('<br>')}</div>`:''}
  ${(a.changes||[]).length?`<div class="dream"><small>変わったこと</small>${a.changes.map(c=>`${Math.floor(c.tk/TICKS_PER_DAY)+1}日目　${esc(c.t)}`).join('<br>')}</div>`:''}
  ${a.odd?`<div class="dream odd"><small>異例の冒険者</small>${esc(ODD_PERK[a.race]||'')}</div>`:''}
  ${C(a).adv||C(a).rare?`<div class="dream cls"><small>${C(a).rare?'レア職業':'上級職（'+esc(a.promoted||C(a).adv)+'から転職）'}・${esc(a.cls)}</small>${esc(C(a).desc)}${a.beast?`<small>相棒：${esc(a.beast.kind)}の${esc(a.beast.name)}</small>`:''}</div>`:''}
  <div class="note">${a.race}：得意　${esc(rc(a).good)}／苦手　${esc(rc(a).bad)}${a.odd?'（克服している）':''}</div>
  ${d?`<div class="dream"><small>夢</small>${esc(dreamText(d))}${dreamProgress(a)?`<small>${esc(dreamProgress(a))}</small>`:''}</div>`:`<div class="dream"><small>夢</small>${a.status==='lost'||a.status==='retired'?'――':'次の夢を探している'}</div>`}
  ${(a.pastDreams||[]).map(x=>`<div class="dream done"><small>かなえた夢・${Math.floor(x.tk/TICKS_PER_DAY)+1}日目</small>${esc(x.t)}${x.note?`<small>${esc(x.note)}</small>`:''}</div>`).join('')}
  <div class="kv"><div><b>${a.kills}</b>討伐</div><div><b>B${a.deepest||0}F</b>最深到達</div><div><b>${a.revived}</b>蘇生</div><div><b>${a.disarms}</b>罠解除</div><div><b>${a.gold}G</b>所持金</div><div><b>${Math.max(0,a.hp)}/${a.mhp}</b>HP</div></div>
  <div class="eqtab">${SLOTS.map(k=>{const it=a.eq&&a.eq[k];const two=k==='shield'&&a.eq&&a.eq.wpn&&a.eq.wpn.two;
    return `<div><span class="sl">${SLOT_N[k]}${k==='wpn'&&it?(it.two?'（両手）':'（片手）'):''}</span><span class="${it&&it.rare?'rare':''}">${it?esc(it.n):two?'――（両手持ち）':'<span class="none">ありあわせ</span>'}</span><span class="st">${it?esc(itemStat(it)):''}</span>${it&&it.lore?`<span class="lore">${esc(it.lore)}</span>`:''}</div>`}).join('')}</div>
  <div class="note">攻撃 ${atkOf(a)}・守り ${acOf(a)}・MP ${mmpOf(a)}${a.loan?'・店から借りた装備あり':''}　所属：${esc(team)}${a.party&&S.parties[a.party]&&S.parties[a.party].leader===a.id?'（リーダー）':''}</div>
  <h3 class="h2" style="margin-top:14px">手帳</h3>
  <ul class="tl">${(a.chron||[]).slice().reverse().map(c=>`<li><span class="d">${Math.floor(c.tk/TICKS_PER_DAY)+1}日目</span>${esc(c.t)}</li>`).join('')}</ul>
  <div style="margin-top:14px;text-align:right"><button class="btn on" data-act="closeadv">閉じる</button></div>`;
  box.scrollTop=st;
}
function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='speed'){setSpeed(+b.dataset.v);return;}
  if(act==='skip'){fastForward(TICKS_PER_DAY,0);return;}
  if(act==='closedigest'){if(ff)return;$('digest').hidden=true;return;}
  if(act==='adv'){advOpen=+b.dataset.a;$('advm').hidden=false;$('advbox').scrollTop=0;renderAdv();return;}
  if(act==='closeadv'){if(b.id==='advm'&&e.target!==b)return;advOpen=null;$('advm').hidden=true;return;}
  if(act==='tab'){tab=b.dataset.v;$('tbody').scrollTop=0;renderSide();return;}
  if(act==='shoptier'){shopTier=+b.dataset.v;renderSide();return;}
  if(act==='selc'){S.sel=+b.dataset.i;render();return;}
  if(act==='watch'){
    const p=S.parties[b.dataset.p];
    if(!visible(p)){toast(p.tav==='rival'?'銀の杯亭の一行は、すれ違ったときしか見えない':'水晶は闇しか映さない');return;}
    const j=S.watch.indexOf(p.id);if(j>=0){S.sel=j;render();return;}
    S.watch[S.sel]=p.id;render();return;
  }
  if(act==='recall'){const p=S.parties[b.dataset.p];if(p&&p.state==='explore'&&T().gold>=50){T().gold-=50;plog(p,'でんしょばとが まいおりた。「すぐ もどれ」','sys');p.state='return';say(S,p,['……店主の めいれいだ。もどるぞ']);render();save();}return;}
  if(act==='reset'){if(confirm('いまの記録を消して、新しい黒猫亭で始め直しますか？')){S=newState();for(let i=0;i<6;i++)tick(S);save();autoWatch();render();toast('黒猫亭が店を開いた');}return;}
  if(act==='repay'){const x=repay(S,+b.dataset.v);if(x)toast(`両替商に${x}Gを返した`);render();save();return;}
  if(act==='seats'){const ns=nextSeats(S);if(ns&&T().gold>=ns[2]){T().gold-=ns[2];T().seats=ns[1];news(S,`黒猫亭が店を広げた。常連の席は${ns[1]}席になった。`,'record');toast(`席が${ns[1]}席になった`);}render();save();return;}
  if(act==='pol'){const k=b.dataset.k,v=+b.dataset.v;policy(S)[k]=k==='potion'?v:!!v;renderSide();save();return;}
  if(act==='gift'){const a=S.adv[b.dataset.a];const o=a&&giftOffer(S,a);const it=o&&giveGift(S,a,o,'店主から');if(it){toast(`${a.name}に${it.n}を贈った`);news(S,`黒猫亭の店主が${a.name}に${it.n}を贈った。`,'info');}render();save();return;}
  if(act==='loan'){const a=S.adv[b.dataset.a];if(a&&T().gold>=100){T().gold-=100;a.loan=100;chron(S,a,'店主からツケで装備を借りる');toast(`${a.name}に装備を貸した`);render();save();}return;}
  if(act==='revive'){const a=S.adv[b.dataset.a];const c=templeCost(S,a);if(T().gold>=c){T().gold-=c;const r=temple(S,a,true);toast(r==='ok'?`${a.name}が蘇った`:r==='ash'?`${a.name}は灰になった…`:`${a.name}はロストした`);render();save();}return;}
  if(act==='bounty'){const p=S.parties[b.dataset.p];if(!p||S.bounties[p.id])return;const c=bountyPrice(p);if(T().gold<c){toast('お金が足りない');return;}T().gold-=c;S.bounties[p.id]=c;toast(`掲示板に依頼を貼り出した（${c}Gを預けた）`);render();save();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&advOpen!=null){advOpen=null;$('advm').hidden=true;return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.c-head')){e.preventDefault();e.target.click();}});
window.addEventListener('pagehide',save);
boot();
</script>
</body>
</html>
