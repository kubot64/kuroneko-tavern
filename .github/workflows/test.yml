name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 毎晩、日本時間 0:00 に完全版を回す
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 種を4つに分けて並べて回す。種に関係ない確かめは 1/4 だけで行う。spec-test は node だけで動くので npm ci は要らない
  spec-test:
    name: spec-test (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 同じ版の runner でも速さが1.5〜2倍ほど違うことがある。あとで比べられるように、CPU を記録に残す
      - name: CPU
        run: nproc; grep -m1 'model name' /proc/cpuinfo
      # pull request は速い版（決まった12種）。main への push、毎晩、手動実行は48種の完全版
      - name: spec-test
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node tools/spec-test.mjs --quick --shard "$SHARD/4"
          else
            node tools/spec-test.mjs --shard "$SHARD/4"
          fi
        env:
          EVENT: ${{ github.event_name }}
          SHARD: ${{ matrix.shard }}

  browser-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ブラウザ本体は Playwright の版ごとに残す。残っていれば、OS の部品だけを入れる
      - name: playwright の版
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node --test tools/browser-test.mjs

  # index.html の script に、使っていない名前と宣言していない名前がないか（ESLint）
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/lint.mjs

  # 釣り合いの指紋。32本（16種×支援なし・あり）を8つに分けて並べて回し、結果を成果物に残す。node だけで動くので npm ci は要らない
  fingerprint-run:
    name: fingerprint-run (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: CPU
        run: nproc; grep -m1 'model name' /proc/cpuinfo
      - run: node tools/fingerprint.mjs --shard "$SHARD/8" --out "fp-part-$SHARD.json"
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        with:
          name: fp-part-${{ matrix.shard }}
          path: fp-part-${{ matrix.shard }}.json

  # 8つの結果を合わせて、指紋（tools/fingerprint.json）と比べ、死因の偏りを見る
  fingerprint:
    needs: fingerprint-run
    runs-on: ubuntu-24.04
    outputs:
      check: ${{ steps.check.outcome }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: fp-part-*
          path: fp-parts
          merge-multiple: true
      # 違っても、下で「書き直したか」を見てから落とす
      - name: fingerprint
        id: check
        continue-on-error: true
        run: node tools/fingerprint.mjs --check --from fp-parts
      # pull request のとき、基のブランチから指紋のファイルを変えたか
      - name: 指紋を書き直したか
        id: changed
        if: always() && github.event_name == 'pull_request'
        run: |
          if git diff --quiet "origin/$BASE_REF" HEAD -- tools/fingerprint.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: 合否
        if: always()
        run: |
          if [ "$CHECK" != "success" ]; then
            echo "指紋が tools/fingerprint.json と違うか、死因が偏りすぎている。上の fingerprint のステップのログを見る"
            exit 1
          fi
        env:
          CHECK: ${{ steps.check.outcome }}

  # 指紋が違ったとき、または pull request で指紋を書き直したときは、変更前と並べて measure で測り、ジョブの要約と成果物に残す。
  # 時間がかかるので、まとめの test は待たない（合否は fingerprint だけで決まる）
  fingerprint-measure:
    needs: fingerprint
    if: always() && (needs.fingerprint.outputs.check == 'failure' || needs.fingerprint.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    steps:
      # 変更前のコミットを measure --base で取り出すので、履歴をすべて取る
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 変更前と並べて測る
        run: |
          BASE="origin/${BASE_REF:-main}"
          # main への push では、push の前のコミットと比べる
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BASE="$BEFORE"; fi
          status=0
          node tools/measure.mjs --seeds 16 --days 1400 --base "$BASE" > measure.txt 2>&1 || status=$?
          {
            echo "## 釣り合い（measure --seeds 16 --days 1400 --base $BASE）"
            echo
            if [ "$CHECK" = "failure" ]; then
              echo "**指紋が tools/fingerprint.json と違うか、死因が偏りすぎている。** fingerprint のジョブのログを見る。釣り合いを変えるつもりなら、\`node tools/fingerprint.mjs --update\` で書き直して同じ変更に入れ、下の表を PR に書く。"
            else
              echo "指紋を書き直した変更。下の表を PR に書く。全文は成果物の measure にある。"
            fi
            echo
            sed -n '/^| | 迷宮を踏破した店/,$p' measure.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          CHECK: ${{ needs.fingerprint.outputs.check }}
      - if: always() && hashFiles('measure.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: measure
          path: measure.txt

  # 分けたジョブがすべて通ったら合格。必須のチェックの名前を test のまま保つ
  test:
    if: always()
    needs: [spec-test, browser-test, lint, fingerprint]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [ "$SPEC" != "success" ] || [ "$BROWSER" != "success" ] || [ "$LINT" != "success" ] || [ "$FINGERPRINT" != "success" ]; then
            echo "spec-test: $SPEC / browser-test: $BROWSER / lint: $LINT / fingerprint: $FINGERPRINT"
            exit 1
          fi
        env:
          SPEC: ${{ needs.spec-test.result }}
          BROWSER: ${{ needs.browser-test.result }}
          LINT: ${{ needs.lint.result }}
          FINGERPRINT: ${{ needs.fingerprint.result }}
